<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Regulatory Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211B;
    --ink-soft:#3E4A42;
    --ink-faint:#707B71;
    --paper:#E3E6DE;
    --paper-raised:#EEF0E9;
    --paper-deep:#D7DBCF;
    --redline:#A63D2F;
    --redline-soft:#c96354;
    --verdigris:#3F7160;
    --verdigris-soft:#77a294;
    --amber:#A97429;
    --amber-soft:#d1a765;
    --slate:#4d5f70;
    --line: rgba(22,33,27,0.15);
    --line-strong: rgba(22,33,27,0.32);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15.5px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--verdigris-soft); color:var(--paper);}
  a{color:inherit;}
  .disp{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit;}

  .shell{ display:grid; grid-template-columns: 310px 1fr; min-height:100vh; }
  @media (max-width: 860px){
    .shell{grid-template-columns: 1fr;}
    .docket{border-right:none; border-bottom:1px solid var(--line-strong);}
  }

  .masthead{
    grid-column: 1 / -1;
    display:flex; align-items:baseline; justify-content:space-between;
    padding:24px 30px 18px 30px;
    border-bottom:2px solid var(--ink);
  }
  .masthead .wordmark{ font-family:'Fraunces', serif; font-weight:700; font-size:28px; letter-spacing:0.2px; }
  .masthead .wordmark small{
    display:block; font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:11px;
    letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-soft); margin-top:3px;
  }
  .masthead .dateline{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); text-align:right; line-height:1.6; }
  .masthead-right{ display:flex; align-items:flex-start; gap:18px; }

  .settings-dropdown-wrap{ position:relative; }
  .settings-gear-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:none; border:1.5px solid var(--ink-faint);
    color:var(--ink-soft); padding:6px 12px; border-radius:var(--radius); cursor:pointer; transition:all .13s; white-space:nowrap;
  }
  .settings-gear-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .settings-dropdown-panel{
    position:absolute; top:calc(100% + 8px); right:0; z-index:30; width:280px;
    background:var(--paper-raised); border:1.5px solid var(--ink); border-radius:var(--radius);
    padding:16px 18px; box-shadow:0 8px 22px rgba(0,0,0,0.16); text-align:left;
  }
  .settings-dropdown-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin-bottom:6px; }
  .settings-dropdown-note{ font-size:12px; color:var(--ink-soft); margin:0 0 12px 0; }
  .strictness-row{ display:flex; align-items:center; margin-bottom:4px; }
  .strictness-row input[type=range]{ flex:1; accent-color:var(--ink); }
  .strictness-scale{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
  .strictness-current{ font-size:12.5px; color:var(--ink); margin-bottom:5px; }
  .strictness-example{ font-size:11.5px; color:var(--ink-soft); font-style:italic; }
  .honesty-banner{
    background:var(--paper-raised); border:1.5px solid var(--amber); border-left-width:4px;
    border-radius:var(--radius); padding:13px 16px; margin-bottom:20px; font-size:13px;
    color:var(--ink-soft); line-height:1.55; max-width:760px;
  }
  .honesty-banner b{ color:var(--ink); }
  .honesty-progress{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .assess-progress-chip{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:3px 8px; border-radius:2px;
    border:1px solid var(--line-strong); color:var(--ink-faint);
  }
  .assess-progress-chip.complete{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .status-badge.unassessed{ color:var(--ink-faint); border-color:var(--line-strong); border-style:dashed; }
  .chip-mini.unassessed{ color:var(--ink-faint); border-style:dashed; }
  .req-note.unassessed{ border-left-color:var(--ink-faint); color:var(--ink-soft); }
  .assess-criteria{ font-size:12.2px; margin-top:5px; color:var(--ink-soft); }
  .retired-track-note{
    font-size:12px; color:var(--ink-soft); background:var(--paper-raised); border-left:3px solid var(--slate);
    padding:9px 12px; margin:0 0 16px 0; max-width:680px; border-radius:0 var(--radius) var(--radius) 0;
  }
  .settings-section-divider{ border-top:1px solid var(--line-strong); margin:16px 0 14px 0; }
  .settings-data-row{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .settings-danger{ color:var(--redline) !important; }
  .settings-import-msg{ font-size:11.5px; color:var(--ink-soft); margin-top:9px; }
  .storage-warning{ font-size:11.5px; color:var(--amber); background:rgba(169,116,41,0.08); border-left:2px solid var(--amber); padding:7px 9px; margin-bottom:10px; }
  .override-basis-changed{ font-size:12px; color:var(--amber); margin-top:7px; }
  label.rescan-btn{ display:inline-block; }

  .docket{ border-right:1px solid var(--line-strong); padding:22px 0 0 0; display:flex; flex-direction:column; }
  .docket-head{ display:flex; align-items:center; justify-content:space-between; padding:0 22px 15px 22px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .docket-head h2{ font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; font-weight:600; color:var(--ink-soft); margin:0; }
  .btn-new{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:var(--ink); color:var(--paper-raised); border:none; padding:7px 11px; border-radius:var(--radius); cursor:pointer; transition:background .15s; }
  .btn-new:hover{ background:var(--verdigris); }

  .docket-list{ overflow-y:auto; flex:1; }
  .docket-entry{
    display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line);
    padding:15px 22px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; color:var(--ink); transition:background .12s;
  }
  .docket-entry:hover{ background:var(--paper-raised); }
  .docket-entry.active{ background:var(--paper-raised); box-shadow: inset 3px 0 0 var(--ink); }
  .docket-num{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:0.5px; }
  .docket-domain{ font-weight:600; font-size:14.5px; margin:3px 0 7px 0; word-break:break-all; }
  .docket-domain .variant-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:400; color:var(--slate); border:1px solid var(--slate); border-radius:2px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .docket-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-mini{ font-family:'IBM Plex Mono', monospace; font-size:10px; padding:2px 6px; border-radius:2px; border:1px solid var(--line-strong); letter-spacing:0.3px; }
  .chip-mini.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .chip-mini.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .chip-mini.fail{ color:var(--redline); border-color:var(--redline-soft); }
  .chip-mini.pending{ color:var(--slate); border-color:var(--slate); }
  .docket-empty{ padding:26px 22px; color:var(--ink-faint); font-size:13px; }
  .disclaimer-foot{ padding:15px 22px; border-top:1px solid var(--line); font-size:10.8px; color:var(--ink-faint); line-height:1.55; }

  .main{ padding:30px 40px 60px 40px; max-width:1020px; }
  .empty-state{ margin-top:0; max-width:540px; }
  .empty-state h1{ font-family:'Fraunces', serif; font-weight:600; font-size:34px; margin:0 0 12px 0; }
  .empty-state p{ color:var(--ink-soft); margin:0 0 24px 0; font-size:15px; }

  .scan-form{ max-width:480px; }
  .scan-form label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px; }
  .scan-form-row{ display:flex; gap:0; margin-bottom:16px; }
  .scan-form input{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:13.5px; padding:12px 13px;
    border:1.5px solid var(--ink); border-right:none; background:var(--paper-raised); color:var(--ink);
    border-radius:var(--radius) 0 0 var(--radius);
  }
  .scan-form input:focus{ outline:none; background:#fff; }
  .scan-form button.go-btn{
    font-family:'IBM Plex Mono', monospace; font-size:13px; padding:0 20px; background:var(--ink);
    color:var(--paper-raised); border:1.5px solid var(--ink); border-radius:0 var(--radius) var(--radius) 0; cursor:pointer; transition:background .15s;
  }
  .scan-form button.go-btn:hover{ background:var(--verdigris); border-color:var(--verdigris); }
  .cancel-link{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; margin-top:4px; }

  .add-country-row{ display:flex; gap:0; margin-bottom:10px; max-width:420px; }
  .add-country-row input{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:9px 11px;
    border:1.3px solid var(--line-strong); border-right:none; background:#fff; color:var(--ink);
    border-radius:var(--radius) 0 0 var(--radius);
  }
  .add-country-row .file-btn{ border-radius:0 var(--radius) var(--radius) 0; border-style:solid; white-space:nowrap; }
  .manual-country-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .manual-country-chip{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:var(--paper-raised);
    border:1px solid var(--line-strong); border-radius:20px; padding:5px 8px 5px 12px; display:inline-flex; align-items:center; gap:6px;
  }
  .chip-remove{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:14px; line-height:1; padding:0 2px; }
  .chip-remove:hover{ color:var(--redline); }
  .err{ color:var(--redline); font-size:11.5px; margin:6px 0 4px 0; }

  .scanning-box{ max-width:480px; border:1.5px solid var(--ink); background:var(--paper-raised); padding:20px 22px; border-radius:var(--radius); }
  .scanning-box .cursor{ font-family:'IBM Plex Mono', monospace; font-size:12.8px; color:var(--ink-soft); }
  .scanning-step{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); padding:4px 0; }
  .scanning-step.done{ color:var(--verdigris); }
  .scanning-step.current{ color:var(--ink); }
  .scanning-step .mark{ display:inline-block; width:16px; }

  .site-header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:22px; flex-wrap:wrap;
  }
  .site-header h1{ font-family:'Fraunces', serif; font-weight:600; font-size:30px; margin:0 0 5px 0; word-break:break-all; }
  .site-header h1 .variant-tag{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:400; color:var(--slate); border:1px solid var(--slate); border-radius:3px; padding:2px 7px; margin-left:8px; vertical-align:middle; }
  .site-meta{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); }
  .site-meta .delta-up{ color:var(--verdigris); }
  .site-meta .delta-down{ color:var(--redline); }
  .header-actions{ display:flex; gap:9px; flex-wrap:wrap; }
  .rescan-btn, .ff-btn, .export-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; background:none; border:1.5px solid var(--ink);
    color:var(--ink); padding:9px 15px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; transition:all .13s;
  }
  .rescan-btn:hover, .export-btn:hover{ background:var(--ink); color:var(--paper-raised); }
  .ff-btn{ border-color:var(--slate); color:var(--slate); font-size:10.8px; }
  .ff-btn:hover{ background:var(--slate); color:var(--paper-raised); }
  .export-btn{ border-color:var(--verdigris); color:var(--verdigris); }
  .export-btn:hover{ background:var(--verdigris); color:#fff; }

  .reg-picker{ display:flex; gap:11px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .reg-picker .label{ font-family:'IBM Plex Mono', monospace; font-size:10.8px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-faint); }
  .reg-toggle, .country-toggle-btn{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:7px 13px; border:1.5px solid var(--line-strong);
    border-radius:20px; cursor:pointer; background:none; color:var(--ink-soft); transition:all .12s;
  }
  .reg-toggle.on{ border-color:var(--ink); color:var(--ink); background:var(--paper-raised); font-weight:500; }
  .country-toggle-btn{ border-style:dashed; }
  .country-toggle-btn.open{ background:var(--paper-raised); }
  .picker-tip{ font-size:11.3px; color:var(--ink-faint); margin:0 0 18px 0; }

  .country-panel{
    background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px 16px; max-width:820px;
  }
  .country-row{ font-size:13px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .country-row input{ accent-color:var(--ink); width:15px; height:15px; cursor:pointer; }
  .country-note{ color:var(--amber); }
  .country-footnote{ grid-column:1/-1; font-size:11px; color:var(--ink-faint); margin-top:6px; border-top:1px solid var(--line); padding-top:8px; }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line-strong); margin-bottom:24px; flex-wrap:wrap; }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; letter-spacing:0.4px; background:none; border:none;
    padding:11px 4px; margin-right:24px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent;
    position:relative; bottom:-1px; transition:color .12s;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--redline); font-weight:500; }
  .tab-btn:hover:not(.active){ color:var(--ink-soft); }

  .stamp-row{ display:flex; gap:28px; margin-bottom:14px; flex-wrap:wrap; }
  .stamp{
    width:92px; height:92px; border-radius:50%; border:3px double currentColor;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg); flex-shrink:0;
  }
  .stamp .grade{ font-family:'Fraunces', serif; font-weight:700; font-size:30px; line-height:1; }
  .stamp .glabel{ font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; margin-top:3px; }
  .stamp.tier-a, .stamp.tier-b{ color:var(--verdigris); }
  .stamp.tier-c{ color:var(--amber); }
  .stamp.tier-d, .stamp.tier-f{ color:var(--redline); }
  .stamp.tier-pending{ color:var(--slate); border-style:dashed; }
  .stamp-wrap{ display:flex; align-items:center; gap:14px; }
  .stamp-num{ font-family:'IBM Plex Mono', monospace; font-size:21px; color:var(--ink-faint); }
  .stamp-caption{ font-size:13px; color:var(--ink-soft); max-width:280px; line-height:1.5; }
  .stamp-caption b{ color:var(--ink); }

  .reg-block{ margin-bottom:38px; }
  .reg-block h3{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:0 0 2px 0; }
  .reg-block .reg-sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); margin-bottom:14px; }
  /* --- region selector: the stamps double as the picker --- */
  .stamp-wrap.selectable{
    background:none; border:1.5px solid transparent; border-radius:var(--radius);
    padding:10px 14px 10px 10px; cursor:pointer; text-align:left; font:inherit; color:inherit;
    transition:border-color .13s, background .13s;
  }
  .stamp-wrap.selectable:hover{ border-color:var(--line-strong); background:var(--paper-raised); }
  .stamp-wrap.selectable.active{ border-color:var(--ink); background:var(--paper-raised); }
  .stamp-wrap.selectable:not(.active){ opacity:.62; }
  .stamp-wrap.selectable:not(.active):hover{ opacity:.85; }
  .stamp-select-hint{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-faint); margin-top:5px;
  }

  /* --- open work vs. passing --- */
  .work-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:20px 0 6px 0; }
  .work-btn{ margin-top:0; white-space:nowrap; }
  .passing-drawer{
    display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
    margin-top:22px; padding:11px 14px; cursor:pointer; font:inherit; color:var(--ink-soft);
    background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius);
    font-size:13px; transition:border-color .13s;
  }
  .passing-drawer:hover{ border-color:var(--ink-faint); }
  .passing-drawer.open{ border-color:var(--ink-faint); }
  .passing-hint{ font-size:11.5px; color:var(--ink-faint); }

  /* --- focus mode --- */
  .focus-panel{ border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--paper-raised); margin-top:18px; overflow:hidden; }
  .focus-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 18px; border-bottom:1px solid var(--line-strong); flex-wrap:wrap; }
  .focus-count{ font-size:11px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-soft); }
  .focus-nav{ display:flex; gap:14px; }
  .focus-nav .link-btn[disabled]{ opacity:.4; cursor:default; }
  .focus-progress{ height:3px; background:var(--paper-deep); }
  .focus-progress-bar{ height:100%; background:var(--verdigris); transition:width .2s; }
  .focus-item{ padding:6px 18px 18px 18px; }
  .focus-item .ledger-row{ border:none; padding-left:0; padding-right:0; }
  .focus-item .checklist-item{ border:none; padding-left:0; padding-right:0; }
  .focus-foot{ padding:10px 18px; border-top:1px solid var(--line-strong); font-size:11.8px; color:var(--ink-faint); }
  .focus-done{ padding:40px 24px; text-align:center; }
  .focus-done-mark{ font-size:30px; color:var(--verdigris); margin-bottom:6px; }

  /* --- evidence attachments --- */
  .att-block{ margin-top:12px; max-width:620px; }
  .att-head{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:7px; }
  .att-list{ margin-bottom:9px; }
  .att-row{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:7px 10px; margin-bottom:5px;
    background:var(--paper-raised); border-left:3px solid var(--verdigris); border-radius:0 var(--radius) var(--radius) 0;
    font-size:12.6px;
  }
  .att-row.reference{ border-left-color:var(--slate); }
  .att-name{ flex:1; min-width:120px; word-break:break-all; }
  .att-size{ font-size:10.5px; color:var(--ink-faint); }
  .att-tier{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 7px; border-radius:2px; border:1px solid var(--verdigris-soft); color:var(--verdigris);
  }
  .att-tier.reference{ border-color:var(--slate); color:var(--slate); }
  .att-why{ flex-basis:100%; font-size:11.5px; color:var(--ink-soft); }
  .att-actions{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .att-legend{ font-size:11.3px; color:var(--ink-faint); margin-top:8px; line-height:1.5; }

  /* --- what the reviewer read --- */
  .ev-review{
    margin-top:11px; padding:11px 14px; max-width:620px;
    background:var(--paper-raised); border-left:3px solid var(--slate); border-radius:0 var(--radius) var(--radius) 0;
  }
  .ev-head{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:8px; }
  .ev-row{ margin-bottom:9px; }
  .ev-row:last-child{ margin-bottom:0; }
  .ev-bearing{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 7px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-faint); margin-right:7px;
  }
  .ev-bearing.supports{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .ev-bearing.contradicts{ color:var(--redline); border-color:var(--redline-soft); }
  .ev-bearing.inconclusive{ color:var(--amber); border-color:var(--amber-soft); }
  .ev-file{ font-size:11px; color:var(--ink-soft); }

  /* recommendations, proposal review, legislation watch */
  .rec-actions{ margin-bottom:18px; }
  .rec-generic-label, .rec-ctx-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); }
  .rec-contextual{ margin-top:10px; padding:12px 14px; background:var(--paper-raised); border-left:3px solid var(--verdigris); border-radius:0 var(--radius) var(--radius) 0; }
  .rec-ctx-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:7px; }
  .rec-ctx-tag{ color:var(--verdigris); }
  .rec-effort{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; padding:2px 7px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-faint); }
  .rec-effort.small{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .rec-effort.large{ color:var(--redline); border-color:var(--redline-soft); }
  .rec-headline{ font-weight:600; font-size:14px; margin-bottom:6px; }
  .rec-steps{ margin:0 0 8px 0; padding-left:20px; font-size:13px; color:var(--ink-soft); }
  .rec-steps li{ margin-bottom:4px; }
  .rec-why, .rec-evidence{ font-size:12.4px; color:var(--ink-soft); margin-top:7px; }
  .rec-evidence ul{ margin:4px 0 0 0; padding-left:18px; }

  .prop-panel{ margin-top:34px; padding-top:22px; border-top:1px solid var(--line-strong); }
  .prop-reqs{ display:flex; flex-direction:column; gap:5px; margin:12px 0; max-width:760px; }

  .prop-text{ min-height:150px; max-width:760px; }
  .prop-result{ margin-top:20px; }
  .prop-result-head{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:10px; }
  .prop-finding{ padding:14px 16px; margin-bottom:12px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius); max-width:760px; }
  .prop-finding-top{ display:flex; gap:11px; align-items:flex-start; margin-bottom:7px; }
  .prop-finding-req{ font-size:13px; font-weight:500; }
  .prop-oos{ font-size:12.3px; color:var(--ink-soft); margin-top:10px; max-width:760px; }

  .watch-panel{ margin-bottom:10px; }
  .watch-head{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .watch-sources{ margin:12px 0; max-width:760px; }
  .watch-src{ display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.8px; }
  .watch-regions{ font-size:10px; color:var(--ink-faint); }
  .watch-state{ font-size:11.5px; color:var(--ink-faint); margin-left:auto; }
  .watch-note{ font-size:11.5px; color:var(--ink-faint); margin-top:9px; line-height:1.5; }
  .watch-results{ margin-top:16px; max-width:760px; }
  .watch-summary{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:10px; }
  .watch-change{ padding:12px 14px; margin-bottom:10px; background:var(--paper-raised); border-left:3px solid var(--amber); border-radius:0 var(--radius) var(--radius) 0; }
  .watch-change-head{ display:flex; gap:10px; align-items:baseline; font-weight:600; font-size:13.2px; }
  .watch-counts{ font-size:10.5px; color:var(--ink-faint); margin:3px 0 7px 0; }
  .watch-lines{ margin:0 0 6px 0; padding-left:18px; font-size:12.3px; color:var(--ink-soft); }
  .watch-lines.added li::marker{ content:'+ '; color:var(--verdigris); }
  .watch-lines.removed li::marker{ content:'− '; color:var(--redline); }
  .watch-failed{ font-size:12.3px; color:var(--amber); margin-top:10px; line-height:1.5; }

  .start-cmd{ margin-top:11px; }
  .start-cmd-head{ display:flex; align-items:center; gap:12px; font-size:11.5px; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.6px; font-family:'IBM Plex Mono', monospace; margin-bottom:5px; }
  .start-cmd-block{
    margin:0; padding:10px 12px; background:var(--ink); color:var(--paper-raised);
    border-radius:var(--radius); font-size:11.5px; line-height:1.65; overflow-x:auto; white-space:pre;
  }
  .start-cmd-note{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5; }
  .source-tag.analysed{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .al-attachments, .al-advisory{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .ev-unread{ font-size:11.5px; color:var(--slate); margin-top:9px; font-style:italic; }

  .ledger-section-label{ font-family:'IBM Plex Mono', monospace; font-size:10.3px; letter-spacing:0.8px; text-transform:uppercase; color:var(--ink-faint); margin:16px 0 4px 0; }

  .country-score-list{
    background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:26px; max-width:620px;
  }
  .country-score-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:5px 0; font-size:13px; }
  .country-score-name{ color:var(--ink-soft); }
  .country-score-note{ font-size:11.5px; color:var(--ink-faint); font-style:italic; }
  .country-score-overall{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line-strong); font-size:13.5px; }

  .ledger{ border-top:1px solid var(--line-strong); }
  .ledger-row{
    display:grid; grid-template-columns: 1fr 92px; gap:16px; padding:15px 10px; margin:0 -10px;
    border-bottom:1px solid var(--line); align-items:start; border-radius:var(--radius); transition:background .12s;
  }
  .ledger-row:hover{ background:rgba(238,240,233,0.7); }
  .req-text{ font-size:14.3px; }
  .collapse-toggle{
    background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:11px; width:16px;
    display:inline-block; text-align:center; padding:0; margin-right:2px; vertical-align:middle;
  }
  .collapse-toggle:hover{ color:var(--ink); }
  .req-code{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-right:8px; cursor:help; border-bottom:1px dotted var(--ink-faint); }
  .layman-text{ font-size:12.6px; color:var(--ink-soft); margin-top:5px; font-style:italic; max-width:600px; }
  .req-note{ font-size:12.6px; color:var(--ink-soft); margin-top:6px; padding-left:14px; border-left:2px solid var(--line-strong); max-width:600px; }
  .req-note.fail{ border-left-color:var(--redline); color:var(--redline-soft); }
  .req-note.partial{ border-left-color:var(--amber); color:#8c6a2e; }
  .status-badge{
    font-family:'IBM Plex Mono', monospace; font-size:10.8px; letter-spacing:0.4px; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; text-align:center; justify-self:end; white-space:nowrap; border:1.3px solid;
  }
  .status-badge.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .status-badge.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .status-badge.fail{ color:var(--redline); border-color:var(--redline-soft); }
  .status-badge.na{ color:var(--ink-faint); border-color:var(--line-strong); }
  .status-badge.pending{ color:var(--slate); border-color:var(--slate); }

  .source-tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.3px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:2px; padding:1.5px 5px; margin-right:7px;
  }
  .source-tag.attested{ color:var(--slate); border-color:var(--slate); }
  .source-tag.crawled{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .crawl-limitation{ font-size:11.8px; color:var(--amber); margin-top:6px; max-width:620px; }
  .crawl-notes{ font-size:11.5px; color:var(--ink-faint); margin-top:8px; }
  .crawl-error{ font-size:12px; color:var(--redline); margin-top:8px; }
  .source-tag.code{ color:var(--verdigris); border-color:var(--verdigris-soft); }

  /* retained: historical source-audit entries still render their evidence */
  /* real evidence tooltip rows */
  .code-ev-tooltip{ width:380px; }
  .code-ev-row{ margin-bottom:8px; }
  .code-ev-row:last-of-type{ margin-bottom:6px; }
  .code-ev-loc{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--verdigris-soft); margin-bottom:2px; word-break:break-all; }
  .code-ev-snippet{ font-family:'IBM Plex Mono', monospace; font-size:10.8px; background:rgba(0,0,0,0.25); padding:4px 7px; border-radius:2px; word-break:break-all; }
  .code-attested-tag{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .code-no-evidence{ color:var(--amber); }

  /* citation hover tooltip */
  .cite-hover{ position:relative; }
  .cite-tooltip{
    display:none; position:absolute; z-index:20; top:130%; left:0; width:320px;
    background:var(--ink); color:var(--paper-raised); padding:12px 14px; border-radius:var(--radius);
    font-family:'IBM Plex Sans', sans-serif; font-size:12.3px; line-height:1.5; box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .cite-tooltip .ct-title{ font-weight:600; font-size:12.3px; margin-bottom:5px; font-family:'Fraunces', serif; }
  .cite-hover:hover .cite-tooltip{ display:block; }

  .evidence-hover{ margin-left:8px; }
  .evidence-trigger{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--slate); text-decoration:underline;
    text-decoration-style:dotted; cursor:help;
  }
  .evidence-tooltip{ width:300px; top:auto; bottom:130%; top:auto; }
  .evidence-quote{ font-style:italic; margin-bottom:7px; }
  .evidence-location{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--paper-deep); margin-bottom:7px; }
  .evidence-disclaimer{ font-size:10.8px; color:var(--paper-deep); opacity:0.85; }

  /* checklist items */
  .checklist-item{ padding:16px 10px; margin:0 -10px; border-bottom:1px solid var(--line); border-radius:var(--radius); transition:background .12s; }
  .checklist-item:hover{ background:rgba(238,240,233,0.7); }
  .checklist-head-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .checklist-check-row{ display:flex; align-items:flex-start; gap:11px; }
  .checklist-check-row input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color: var(--ink); cursor:pointer; }
  .checklist-label{ font-size:14.3px; cursor:pointer; }
  .checklist-guidance{ font-size:12.2px; color:var(--ink-faint); margin:5px 0 0 27px; }
  .checklist-body{ margin:13px 0 0 27px; max-width:660px; }
  .checklist-textarea{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13.2px; padding:10px 11px;
    border:1.3px solid var(--line-strong); border-radius:var(--radius); background:#fff; resize:vertical; min-height:58px;
  }
  .checklist-file-row{ display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap; }
  .file-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.3px; border:1.3px dashed var(--line-strong);
    background:var(--paper-raised); padding:7px 11px; border-radius:var(--radius); cursor:pointer; color:var(--ink-soft);
  }
  .thumb-preview{ height:40px; border-radius:3px; border:1px solid var(--line-strong); }
  .submit-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; background:var(--ink); color:var(--paper-raised);
    border:none; padding:9px 15px; border-radius:var(--radius); cursor:pointer; margin-top:11px; transition:background .13s;
  }
  .submit-btn:hover{ background:var(--verdigris); }
  .followup-box{
    margin-top:13px; padding:13px 15px; background:var(--paper-raised); border-left:3px solid var(--amber);
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .followup-q{ font-size:13.2px; font-weight:500; margin-bottom:6px; }
  .followup-sketch{ font-size:12.3px; color:var(--ink-soft); margin-bottom:11px; font-style:italic; }
  .result-box{ margin-top:11px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .confidence-tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.4px;
    padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-faint);
  }
  .rationale-text{ font-size:12.6px; color:var(--ink-soft); margin-top:7px; max-width:580px; }
  .stale-badge{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; color:var(--redline);
    border:1px solid var(--redline-soft); border-radius:2px; padding:1.5px 6px; margin-left:6px;
  }
  .attested-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.3px; color:var(--ink-faint); margin-top:7px; }

  /* attestation review — interviewer output */
  .reviewing-note{ font-size:12.6px; color:var(--ink-soft); font-style:italic; margin-top:11px; }
  .reviewer-hint{ font-size:11.8px; color:var(--ink-faint); margin-top:9px; max-width:580px; line-height:1.55; }
  .reviewer-tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.4px;
    padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-strong);
  }
  .reviewer-tag.model{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .reviewer-tag.keyword{ color:var(--amber); border-color:var(--amber-soft); }
  .reviewer-fallback{ font-size:11.8px; color:var(--amber); margin-top:8px; max-width:580px; }
  .basis-box{
    margin-top:11px; padding:11px 14px; background:var(--paper-raised);
    border-left:3px solid var(--verdigris); border-radius:0 var(--radius) var(--radius) 0; max-width:580px;
  }
  .basis-head, .gaps-head, .interview-head{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:8px;
  }
  .basis-row{ margin-bottom:9px; }
  .basis-row:last-child{ margin-bottom:0; }
  .basis-quote{ font-size:12.6px; color:var(--ink); font-style:italic; }
  .basis-est{ font-size:11.8px; color:var(--ink-soft); margin-top:2px; }
  .gaps-box{
    margin-top:11px; padding:11px 14px; background:var(--paper-raised);
    border-left:3px solid var(--amber); border-radius:0 var(--radius) var(--radius) 0; max-width:580px;
  }
  .gaps-box ul{ margin:0; padding-left:18px; }
  .gaps-box li{ font-size:12.4px; color:var(--ink-soft); margin-bottom:4px; }
  .ungrounded-warn{
    margin-top:11px; padding:9px 13px; font-size:12.2px; color:var(--redline);
    border:1px solid var(--redline-soft); border-radius:var(--radius); max-width:580px; line-height:1.5;
  }
  .interview-thread{ margin-top:12px; max-width:580px; }
  .interview-turn{ border-left:2px solid var(--line-strong); padding-left:11px; margin-bottom:9px; }
  .interview-q{ font-size:12.4px; color:var(--ink); font-weight:500; }
  .interview-a{ font-size:12.4px; color:var(--ink-soft); margin-top:2px; }

  /* settings — page discovery */
  .discovery-opts{ display:flex; flex-direction:column; gap:7px; }
  .discovery-opt{
    display:flex; gap:9px; align-items:flex-start; padding:8px 10px; cursor:pointer;
    border:1.5px solid var(--line-strong); border-radius:var(--radius); font-size:12.4px; transition:border-color .13s;
  }
  .discovery-opt:hover{ border-color:var(--ink-faint); }
  .discovery-opt.on{ border-color:var(--ink); }
  .discovery-opt.disabled{ opacity:.5; cursor:not-allowed; }
  .discovery-note{ font-size:11.5px; color:var(--ink-soft); }
  .discovery-warn{ font-size:11.5px; color:var(--amber); margin-top:8px; }

  /* overrides */
  .override-wrap{ margin-top:10px; }
  .link-btn{ font-family:'IBM Plex Mono', monospace; font-size:11.3px; color:var(--slate); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }
  .override-form{ margin-top:9px; padding:12px 14px; background:#fff; border:1px dashed var(--line-strong); border-radius:var(--radius); max-width:560px; }
  .override-form select{ font-family:'IBM Plex Mono', monospace; font-size:12px; padding:6px 9px; border:1.3px solid var(--line-strong); border-radius:var(--radius); margin-bottom:9px; background:var(--paper-raised); }
  .override-form .err{ color:var(--redline); font-size:11px; margin-top:4px; }
  .override-note{ font-size:12.4px; color:var(--ink-soft); background:var(--paper-raised); border-left:3px solid var(--slate); padding:9px 12px; border-radius:0 var(--radius) var(--radius) 0; margin-top:9px; max-width:600px; }
  .override-badge{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; color:var(--slate); border:1px solid var(--slate); border-radius:2px; padding:1.5px 6px; margin-right:6px; }
  .learn-flag{ font-size:11.5px; color:var(--amber); margin-top:7px; max-width:520px; }

  .filters{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .filters select{
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:7px 11px; border:1.3px solid var(--line-strong);
    border-radius:var(--radius); background:var(--paper-raised); color:var(--ink);
  }
  .bill-card{
    border:1px solid var(--line-strong); border-left:3px solid var(--ink); background:var(--paper-raised);
    padding:16px 18px; margin-bottom:13px; border-radius:0 var(--radius) var(--radius) 0; box-shadow:0 1px 2px rgba(22,33,27,0.04);
  }
  .bill-top{ display:flex; justify-content:space-between; gap:12px; margin-bottom:5px; align-items:baseline; flex-wrap:wrap; }
  .bill-name{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; }
  .bill-tags{ display:flex; gap:6px; flex-shrink:0; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.4px; padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-soft); }
  .bill-summary{ font-size:13.3px; color:var(--ink-soft); margin:7px 0; }
  .bill-meta{ font-size:12.6px; margin-top:9px; }
  .bill-meta .relevance{ margin-bottom:5px; }
  .bill-meta .prep{ color:var(--verdigris); }
  .bill-meta b{ font-weight:600; }

  .precedent{ background:var(--paper-raised); border:1px dashed var(--line-strong); padding:11px 13px; font-size:12.6px; border-radius:var(--radius); margin-top:8px; max-width:600px; }
  .precedent .pre-label{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); margin-bottom:5px; }
  .precedent .fine{ color:var(--redline); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .precedent .none{ color:var(--ink-faint); font-style:italic; }

  .exposure-summary{
    background:var(--paper-raised); border:1.5px solid var(--redline-soft); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:22px; max-width:620px;
  }
  .exposure-label{ font-size:12.8px; color:var(--ink-soft); margin-bottom:6px; }
  .exposure-range{ font-size:20px; font-weight:600; color:var(--redline); margin-bottom:6px; }
  .exposure-note{ font-size:11px; color:var(--ink-faint); }

  /* recommendations */
  .rec-intro{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; max-width:680px; }
  .rec-card{ border:1px solid var(--line-strong); border-left:3px solid var(--verdigris); background:var(--paper-raised); border-radius:0 var(--radius) var(--radius) 0; padding:17px 19px; margin-bottom:15px; box-shadow:0 1px 2px rgba(22,33,27,0.04); }
  .rec-card.high{ border-left-color:var(--redline); }
  .rec-card.med{ border-left-color:var(--amber); }
  .rec-top{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:5px; }
  .rec-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; }
  .rec-layman{ font-size:13.2px; color:var(--ink-soft); font-style:italic; margin-bottom:11px; }
  .rec-proposals{ margin:0; padding-left:19px; font-size:13px; }
  .rec-proposals li{ margin-bottom:5px; }

  .trust-cat{ margin-bottom:22px; }
  .trust-cat-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
  .trust-cat-name{ font-weight:600; font-size:14.5px; }
