<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Regulatory Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211B;
    --ink-soft:#3E4A42;
    --ink-faint:#707B71;
    --paper:#E3E6DE;
    --paper-raised:#EEF0E9;
    --paper-deep:#D7DBCF;
    --redline:#A63D2F;
    --redline-soft:#c96354;
    --verdigris:#3F7160;
    --verdigris-soft:#77a294;
    --amber:#A97429;
    --amber-soft:#d1a765;
    --slate:#4d5f70;
    --line: rgba(22,33,27,0.15);
    --line-strong: rgba(22,33,27,0.32);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15.5px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--verdigris-soft); color:var(--paper);}
  a{color:inherit;}
  .disp{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit;}

  .shell{ display:grid; grid-template-columns: 310px 1fr; min-height:100vh; }
  @media (max-width: 860px){
    .shell{grid-template-columns: 1fr;}
    .docket{border-right:none; border-bottom:1px solid var(--line-strong);}
  }

  .masthead{
    grid-column: 1 / -1;
    display:flex; align-items:baseline; justify-content:space-between;
    padding:24px 30px 18px 30px;
    border-bottom:2px solid var(--ink);
  }
  .masthead .wordmark{ font-family:'Fraunces', serif; font-weight:700; font-size:28px; letter-spacing:0.2px; }
  .masthead .wordmark small{
    display:block; font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:11px;
    letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-soft); margin-top:3px;
  }
  .masthead .dateline{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); text-align:right; line-height:1.6; }

  .docket{ border-right:1px solid var(--line-strong); padding:22px 0 0 0; display:flex; flex-direction:column; }
  .docket-head{ display:flex; align-items:center; justify-content:space-between; padding:0 22px 15px 22px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .docket-head h2{ font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; font-weight:600; color:var(--ink-soft); margin:0; }
  .btn-new{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:var(--ink); color:var(--paper-raised); border:none; padding:7px 11px; border-radius:var(--radius); cursor:pointer; transition:background .15s; }
  .btn-new:hover{ background:var(--verdigris); }

  .docket-list{ overflow-y:auto; flex:1; }
  .docket-entry{
    display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line);
    padding:15px 22px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; color:var(--ink); transition:background .12s;
  }
  .docket-entry:hover{ background:var(--paper-raised); }
  .docket-entry.active{ background:var(--paper-raised); box-shadow: inset 3px 0 0 var(--ink); }
  .docket-num{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); letter-spacing:0.5px; }
  .docket-domain{ font-weight:600; font-size:14.5px; margin:3px 0 7px 0; word-break:break-all; }
  .docket-domain .variant-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:400; color:var(--slate); border:1px solid var(--slate); border-radius:2px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .docket-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-mini{ font-family:'IBM Plex Mono', monospace; font-size:10px; padding:2px 6px; border-radius:2px; border:1px solid var(--line-strong); letter-spacing:0.3px; }
  .chip-mini.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .chip-mini.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .chip-mini.fail{ color:var(--redline); border-color:var(--redline-soft); }
  .docket-empty{ padding:26px 22px; color:var(--ink-faint); font-size:13px; }
  .disclaimer-foot{ padding:15px 22px; border-top:1px solid var(--line); font-size:10.8px; color:var(--ink-faint); line-height:1.55; }

  .main{ padding:30px 40px 60px 40px; max-width:1020px; }
  .empty-state{ margin-top:56px; max-width:540px; }
  .empty-state h1{ font-family:'Fraunces', serif; font-weight:600; font-size:34px; margin:0 0 12px 0; }
  .empty-state p{ color:var(--ink-soft); margin:0 0 24px 0; font-size:15px; }

  .scan-form{ max-width:480px; }
  .scan-form label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:6px; }
  .scan-form-row{ display:flex; gap:0; margin-bottom:16px; }
  .scan-form input{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:13.5px; padding:12px 13px;
    border:1.5px solid var(--ink); border-right:none; background:var(--paper-raised); color:var(--ink);
    border-radius:var(--radius) 0 0 var(--radius);
  }
  .scan-form input:focus{ outline:none; background:#fff; }
  .scan-form button.go-btn{
    font-family:'IBM Plex Mono', monospace; font-size:13px; padding:0 20px; background:var(--ink);
    color:var(--paper-raised); border:1.5px solid var(--ink); border-radius:0 var(--radius) var(--radius) 0; cursor:pointer; transition:background .15s;
  }
  .scan-form button.go-btn:hover{ background:var(--verdigris); border-color:var(--verdigris); }
  .variant-group{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .variant-pick{
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:7px 13px; border:1.5px solid var(--line-strong);
    border-radius:20px; cursor:pointer; background:none; color:var(--ink-soft); transition:all .12s;
  }
  .variant-pick.on{ border-color:var(--ink); color:var(--ink); background:var(--paper-raised); font-weight:500; }
  .cancel-link{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; margin-top:4px; }

  .scanning-box{ max-width:480px; border:1.5px solid var(--ink); background:var(--paper-raised); padding:20px 22px; border-radius:var(--radius); }
  .scanning-box .cursor{ font-family:'IBM Plex Mono', monospace; font-size:12.8px; color:var(--ink-soft); }
  .scanning-step{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); padding:4px 0; }
  .scanning-step.done{ color:var(--verdigris); }
  .scanning-step.current{ color:var(--ink); }
  .scanning-step .mark{ display:inline-block; width:16px; }

  .site-header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:22px; flex-wrap:wrap;
  }
  .site-header h1{ font-family:'Fraunces', serif; font-weight:600; font-size:30px; margin:0 0 5px 0; word-break:break-all; }
  .site-header h1 .variant-tag{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:400; color:var(--slate); border:1px solid var(--slate); border-radius:3px; padding:2px 7px; margin-left:8px; vertical-align:middle; }
  .site-meta{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-faint); }
  .site-meta .delta-up{ color:var(--verdigris); }
  .site-meta .delta-down{ color:var(--redline); }
  .header-actions{ display:flex; gap:9px; flex-wrap:wrap; }
  .rescan-btn, .ff-btn, .export-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; background:none; border:1.5px solid var(--ink);
    color:var(--ink); padding:9px 15px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; transition:all .13s;
  }
  .rescan-btn:hover, .export-btn:hover{ background:var(--ink); color:var(--paper-raised); }
  .ff-btn{ border-color:var(--slate); color:var(--slate); font-size:10.8px; }
  .ff-btn:hover{ background:var(--slate); color:var(--paper-raised); }
  .export-btn{ border-color:var(--verdigris); color:var(--verdigris); }
  .export-btn:hover{ background:var(--verdigris); color:#fff; }

  .reg-picker{ display:flex; gap:11px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .reg-picker .label{ font-family:'IBM Plex Mono', monospace; font-size:10.8px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-faint); }
  .reg-toggle, .country-toggle-btn{
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:7px 13px; border:1.5px solid var(--line-strong);
    border-radius:20px; cursor:pointer; background:none; color:var(--ink-soft); transition:all .12s;
  }
  .reg-toggle.on{ border-color:var(--ink); color:var(--ink); background:var(--paper-raised); font-weight:500; }
  .country-toggle-btn{ border-style:dashed; }
  .country-toggle-btn.open{ background:var(--paper-raised); }
  .picker-tip{ font-size:11.3px; color:var(--ink-faint); margin:0 0 18px 0; }

  .country-panel{
    background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px 16px; max-width:820px;
  }
  .country-row{ font-size:13px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .country-row input{ accent-color:var(--ink); width:15px; height:15px; cursor:pointer; }
  .country-note{ color:var(--amber); }
  .country-footnote{ grid-column:1/-1; font-size:11px; color:var(--ink-faint); margin-top:6px; border-top:1px solid var(--line); padding-top:8px; }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line-strong); margin-bottom:24px; flex-wrap:wrap; }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; letter-spacing:0.4px; background:none; border:none;
    padding:11px 4px; margin-right:24px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent;
    position:relative; bottom:-1px; transition:color .12s;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--redline); font-weight:500; }
  .tab-btn:hover:not(.active){ color:var(--ink-soft); }

  .stamp-row{ display:flex; gap:28px; margin-bottom:14px; flex-wrap:wrap; }
  .stamp{
    width:92px; height:92px; border-radius:50%; border:3px double currentColor;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg); flex-shrink:0;
  }
  .stamp .grade{ font-family:'Fraunces', serif; font-weight:700; font-size:30px; line-height:1; }
  .stamp .glabel{ font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; margin-top:3px; }
  .stamp.tier-a, .stamp.tier-b{ color:var(--verdigris); }
  .stamp.tier-c{ color:var(--amber); }
  .stamp.tier-d, .stamp.tier-f{ color:var(--redline); }
  .stamp-wrap{ display:flex; align-items:center; gap:14px; }
  .stamp-num{ font-family:'IBM Plex Mono', monospace; font-size:21px; color:var(--ink-faint); }
  .stamp-caption{ font-size:13px; color:var(--ink-soft); max-width:280px; line-height:1.5; }
  .stamp-caption b{ color:var(--ink); }

  .reg-block{ margin-bottom:38px; }
  .reg-block h3{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:0 0 2px 0; }
  .reg-block .reg-sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); margin-bottom:14px; }

  .ledger{ border-top:1px solid var(--line-strong); }
  .ledger-row{
    display:grid; grid-template-columns: 1fr 92px; gap:16px; padding:15px 10px; margin:0 -10px;
    border-bottom:1px solid var(--line); align-items:start; border-radius:var(--radius); transition:background .12s;
  }
  .ledger-row:hover{ background:rgba(238,240,233,0.7); }
  .req-text{ font-size:14.3px; }
  .req-code{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-right:8px; cursor:help; border-bottom:1px dotted var(--ink-faint); }
  .layman-text{ font-size:12.6px; color:var(--ink-soft); margin-top:5px; font-style:italic; max-width:600px; }
  .req-note{ font-size:12.6px; color:var(--ink-soft); margin-top:6px; padding-left:14px; border-left:2px solid var(--line-strong); max-width:600px; }
  .req-note.fail{ border-left-color:var(--redline); color:var(--redline-soft); }
  .req-note.partial{ border-left-color:var(--amber); color:#8c6a2e; }
  .status-badge{
    font-family:'IBM Plex Mono', monospace; font-size:10.8px; letter-spacing:0.4px; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; text-align:center; justify-self:end; white-space:nowrap; border:1.3px solid;
  }
  .status-badge.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .status-badge.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .status-badge.fail{ color:var(--redline); border-color:var(--redline-soft); }
  .status-badge.na{ color:var(--ink-faint); border-color:var(--line-strong); }
  .status-badge.pending{ color:var(--slate); border-color:var(--slate); }

  .source-tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.3px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:2px; padding:1.5px 5px; margin-right:7px;
  }
  .source-tag.attested{ color:var(--slate); border-color:var(--slate); }

  /* citation hover tooltip */
  .cite-hover{ position:relative; }
  .cite-tooltip{
    display:none; position:absolute; z-index:20; top:130%; left:0; width:320px;
    background:var(--ink); color:var(--paper-raised); padding:12px 14px; border-radius:var(--radius);
    font-family:'IBM Plex Sans', sans-serif; font-size:12.3px; line-height:1.5; box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .cite-tooltip .ct-title{ font-weight:600; font-size:12.3px; margin-bottom:5px; font-family:'Fraunces', serif; }
  .cite-hover:hover .cite-tooltip{ display:block; }

  /* checklist items */
  .checklist-item{ padding:16px 10px; margin:0 -10px; border-bottom:1px solid var(--line); border-radius:var(--radius); transition:background .12s; }
  .checklist-item:hover{ background:rgba(238,240,233,0.7); }
  .checklist-head-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .checklist-check-row{ display:flex; align-items:flex-start; gap:11px; }
  .checklist-check-row input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color: var(--ink); cursor:pointer; }
  .checklist-label{ font-size:14.3px; cursor:pointer; }
  .checklist-guidance{ font-size:12.2px; color:var(--ink-faint); margin:5px 0 0 27px; }
  .checklist-body{ margin:13px 0 0 27px; max-width:660px; }
  .checklist-textarea{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13.2px; padding:10px 11px;
    border:1.3px solid var(--line-strong); border-radius:var(--radius); background:#fff; resize:vertical; min-height:58px;
  }
  .checklist-file-row{ display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap; }
  .file-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.3px; border:1.3px dashed var(--line-strong);
    background:var(--paper-raised); padding:7px 11px; border-radius:var(--radius); cursor:pointer; color:var(--ink-soft);
  }
  .thumb-preview{ height:40px; border-radius:3px; border:1px solid var(--line-strong); }
  .submit-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11.8px; background:var(--ink); color:var(--paper-raised);
    border:none; padding:9px 15px; border-radius:var(--radius); cursor:pointer; margin-top:11px; transition:background .13s;
  }
  .submit-btn:hover{ background:var(--verdigris); }
  .followup-box{
    margin-top:13px; padding:13px 15px; background:var(--paper-raised); border-left:3px solid var(--amber);
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .followup-q{ font-size:13.2px; font-weight:500; margin-bottom:6px; }
  .followup-sketch{ font-size:12.3px; color:var(--ink-soft); margin-bottom:11px; font-style:italic; }
  .result-box{ margin-top:11px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .confidence-tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.4px;
    padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-faint);
  }
  .rationale-text{ font-size:12.6px; color:var(--ink-soft); margin-top:7px; max-width:580px; }
  .stale-badge{
    font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; color:var(--redline);
    border:1px solid var(--redline-soft); border-radius:2px; padding:1.5px 6px; margin-left:6px;
  }
  .attested-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.3px; color:var(--ink-faint); margin-top:7px; }

  /* overrides */
  .override-wrap{ margin-top:10px; }
  .link-btn{ font-family:'IBM Plex Mono', monospace; font-size:11.3px; color:var(--slate); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }
  .override-form{ margin-top:9px; padding:12px 14px; background:#fff; border:1px dashed var(--line-strong); border-radius:var(--radius); max-width:560px; }
  .override-form select{ font-family:'IBM Plex Mono', monospace; font-size:12px; padding:6px 9px; border:1.3px solid var(--line-strong); border-radius:var(--radius); margin-bottom:9px; background:var(--paper-raised); }
  .override-form .err{ color:var(--redline); font-size:11px; margin-top:4px; }
  .override-note{ font-size:12.4px; color:var(--ink-soft); background:var(--paper-raised); border-left:3px solid var(--slate); padding:9px 12px; border-radius:0 var(--radius) var(--radius) 0; margin-top:9px; max-width:600px; }
  .override-badge{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; color:var(--slate); border:1px solid var(--slate); border-radius:2px; padding:1.5px 6px; margin-right:6px; }
  .learn-flag{ font-size:11.5px; color:var(--amber); margin-top:7px; max-width:520px; }

  .filters{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .filters select{
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:7px 11px; border:1.3px solid var(--line-strong);
    border-radius:var(--radius); background:var(--paper-raised); color:var(--ink);
  }
  .bill-card{
    border:1px solid var(--line-strong); border-left:3px solid var(--ink); background:var(--paper-raised);
    padding:16px 18px; margin-bottom:13px; border-radius:0 var(--radius) var(--radius) 0; box-shadow:0 1px 2px rgba(22,33,27,0.04);
  }
  .bill-top{ display:flex; justify-content:space-between; gap:12px; margin-bottom:5px; align-items:baseline; flex-wrap:wrap; }
  .bill-name{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; }
  .bill-tags{ display:flex; gap:6px; flex-shrink:0; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.4px; padding:2.5px 8px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-soft); }
  .bill-summary{ font-size:13.3px; color:var(--ink-soft); margin:7px 0; }
  .bill-meta{ font-size:12.6px; margin-top:9px; }
  .bill-meta .relevance{ margin-bottom:5px; }
  .bill-meta .prep{ color:var(--verdigris); }
  .bill-meta b{ font-weight:600; }

  .risk-item{ display:grid; grid-template-columns: 36px 1fr; gap:15px; padding:18px 0; border-bottom:1px solid var(--line); }
  .risk-rank{ font-family:'Fraunces', serif; font-size:26px; font-weight:700; color:var(--redline); }
  .risk-title{ font-size:15px; font-weight:500; margin-bottom:5px; }
  .risk-sev{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; }
  .risk-remedy{ font-size:13.3px; color:var(--ink-soft); margin-bottom:11px; }
  .precedent{ background:var(--paper-raised); border:1px dashed var(--line-strong); padding:11px 13px; font-size:12.6px; border-radius:var(--radius); }
  .precedent .pre-label{ font-family:'IBM Plex Mono', monospace; font-size:9.8px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); margin-bottom:5px; }
  .precedent .fine{ color:var(--redline); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .precedent .none{ color:var(--ink-faint); font-style:italic; }
  .risk-disclaimer{ margin-top:22px; font-size:11.8px; color:var(--ink-faint); border-top:1px solid var(--line); padding-top:13px; }

  /* recommendations */

   ============================================================ */
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }
function seededRandom(seedStr){ let h=hashStr(seedStr); let x=Math.sin(h)*10000; return x-Math.floor(x); }

function statusFor(domain, variant, salt, req){
  const seedBase = domain + '::' + variant + '::' + salt + '::' + req.id;
  // Demonstrates the "EU vs US cookie banner" scenario explicitly for the consent requirement.
  if(req.id === 'gdpr-s2'){
    if(variant === 'EU' || variant === 'CH'){
      return seededRandom(seedBase+'::eu-consent') < 0.85 ? 'Pass' : 'Partial';
    }
    if(variant === 'US'){
      return seededRandom(seedBase+'::us-consent') < 0.55 ? 'Fail' : 'Partial';
    }
  }
  if(req.na && seededRandom(seedBase+'::na') < 0.12) return 'NA';
  const r = seededRandom(seedBase+'::status');
  if(r < 0.42) return 'Pass';
  if(r < 0.74) return 'Partial';
  return 'Fail';
}

function gradeLabel(score){
  if(score>=90) return 'A';
  if(score>=80) return 'B';
  if(score>=70) return 'C';
  if(score>=60) return 'D';
  return 'F';
}
function tierClass(grade){
  if(grade==='A') return 'tier-a';
  if(grade==='B') return 'tier-b';
  if(grade==='C') return 'tier-c';
  if(grade==='D') return 'tier-d';
  return 'tier-f';
}

function regDefs(regKey){
  return regKey==='GDPR'
    ? {scanned:GDPR_SCANNED, checklist:GDPR_CHECKLIST, label:'General Data Protection Regulation \u2014 EU / EEA'}
    : {scanned:CCPA_SCANNED, checklist:CCPA_CHECKLIST, label:'California Consumer Privacy Act, as amended by CPRA'};
}

function rawStatus(site, scan, regKey, item, source){
  if(source === 'scanned') return scan.scanned[regKey][item.id];
  const st = site.checklistState[item.id];
  if(st && st.finalized) return st.status;
  if(st && st.checked) return 'Pending';
  return 'Fail';
}
function itemEffectiveStatus(site, scan, regKey, item, source){
  const ov = site.overrides[item.id];
  if(ov) return ov.status;
  return rawStatus(site, scan, regKey, item, source);
}

function blendedScore(site, scan, regKey){
  const {scanned, checklist} = regDefs(regKey);
  let total=0, earned=0;
  scanned.forEach(r=>{
    const st = itemEffectiveStatus(site, scan, regKey, r, 'scanned');
    if(st==='NA') return;
    const w = SEV_WEIGHT[r.sev]; total+=w;
    if(st==='Pass') earned+=w; else if(st==='Partial') earned+=w*0.5;
  });
  checklist.forEach(item=>{
    const st = itemEffectiveStatus(site, scan, regKey, item, 'attested');
    if(st==='NA') return;
    const w = SEV_WEIGHT[item.sev]; total+=w;
    if(st==='Pass') earned+=w; else if(st==='Partial') earned+=w*0.5;
  });
  if(total===0) return 100;
  return Math.round((earned/total)*100);
}

function gapItems(site, scan, regKey){
  const {scanned, checklist} = regDefs(regKey);
  const list = [];
  scanned.forEach(r=>{
    const st = itemEffectiveStatus(site, scan, regKey, r, 'scanned');
    if(st==='Fail'||st==='Partial') list.push({item:r, source:'scanned', status:st, regKey});
  });
  checklist.forEach(item=>{
    const st = itemEffectiveStatus(site, scan, regKey, item, 'attested');
    if(st==='Fail'||st==='Partial'||st==='Pending') list.push({item, source:'attested', status:st, regKey});
  });
  list.sort((a,b)=>{
    const sw = s => s==='Fail'?3:s==='Pending'?2.5:2;
    const sa = SEV_WEIGHT[a.item.sev]*10 + sw(a.status);
    const sb = SEV_WEIGHT[b.item.sev]*10 + sw(b.status);
    return sb-sa;
  });
  return list;
}

function topGapsCaption(site, scan, regKey){
  const gaps = gapItems(site, scan, regKey).slice(0,2);
  if(gaps.length===0) return 'No material gaps found in this scan \u2014 nice work.';
  const parts = gaps.map(g=>`<b>${g.item.text.split(' \u2014')[0]}</b> (${SEV_LABEL[g.item.sev].toLowerCase()})`);
  return 'Held back mainly by: ' + parts.join(', and ') + '.';
}

function runScan(domain, variant, salt){
  const scannedGDPR = {}; GDPR_SCANNED.forEach(r=>{ scannedGDPR[r.id] = statusFor(domain, variant, salt, r); });
  const scannedCCPA = {}; CCPA_SCANNED.forEach(r=>{ scannedCCPA[r.id] = statusFor(domain, variant, salt, r); });

  const trust = {};
  TRUST_CATS.forEach(c=>{
    const r = seededRandom(domain+'::'+variant+'::'+salt+'::trust::'+c.id);
    trust[c.id] = Math.round(40 + r*58);
  });
  const trustScore = Math.round(TRUST_CATS.reduce((a,c)=>a+trust[c.id],0)/TRUST_CATS.length);

  return {
    timestamp: Date.now(),
    scanned: {GDPR: scannedGDPR, CCPA: scannedCCPA},
    trust: {scores: trust, score: trustScore},
  };
}

/* ============================================================
   SIMULATED CHECKLIST REVIEW (prototype heuristic, not a live LLM call)
   ============================================================ */
function countMatches(text, words){
  const t = text.toLowerCase();
  return words.reduce((n,w)=> t.includes(w) ? n+1 : n, 0);
}

function reviewSubmission(item, description, hasScreenshot, followUpAnswer){
  const combined = (description || '') + ' ' + (followUpAnswer || '');
  const wordCount = (description || '').trim().split(/\s+/).filter(Boolean).length;

  let confidenceScore = 0;
  if(wordCount >= 18) confidenceScore++;
  if(hasScreenshot) confidenceScore++;
  if(followUpAnswer) confidenceScore++;

  const isFirstPass = !followUpAnswer;
  const lowInfo = wordCount < 12 && !hasScreenshot;

  if(isFirstPass && lowInfo){
    return { needsFollowUp: true, followUpQuestion: item.followUp, sketch: item.guidance };
  }

  const posMatches = countMatches(combined, item.pos);
  const negMatches = countMatches(combined, item.neg);

  let status;
  if(negMatches > 0 && negMatches >= posMatches) status = 'Fail';
  else if(posMatches >= 2) status = 'Pass';
  else status = 'Partial';

  let confidence = confidenceScore >= 2 ? 'High' : confidenceScore === 1 ? 'Medium' : 'Low';
  if(followUpAnswer) confidence = confidenceScore >= 2 ? 'High' : 'Medium';

  let rationale;
  if(status === 'Pass') rationale = 'The description matches the pattern of a working self-serve flow' + (hasScreenshot ? ', corroborated by the attached screenshot.' : '.');
  else if(status === 'Fail') rationale = 'The description points to a manual/support-mediated process rather than a self-serve one built into the product.';
  else rationale = 'The description is plausible but doesn\u2019t clearly confirm all the criteria for this requirement' + (hasScreenshot ? ' \u2014 the screenshot helps but isn\u2019t fully conclusive.' : '.');

  return { needsFollowUp: false, status, confidence, rationale };
}

function cleanDomain(input){
  let d = input.trim().toLowerCase();
  d = d.replace(/^https?:\/\//, '').replace(/^www\./, '');
  d = d.split('/')[0];
  return d || 'example.com';
}
function pad3(n){ return String(n).padStart(3,'0'); }
function draftKey(siteId, itemId){ return siteId+'::'+itemId; }
function getDraft(siteId, itemId){
  const k = draftKey(siteId, itemId);
  if(!state.drafts[k]) state.drafts[k] = {description:'', screenshot:null, followUpAnswer:''};
  return state.drafts[k];
}
function defaultCountriesFor(variant){
  if(variant==='EU') return ['DE'];
  if(variant==='US') return ['US-CA'];
  if(variant==='CH') return ['CH'];
  return [];
}
function defaultManualRegsFor(variant){
  if(variant==='EU') return {GDPR:true, CCPA:false};
  if(variant==='US') return {GDPR:false, CCPA:true};
  if(variant==='CH') return {GDPR:true, CCPA:false};
  return {GDPR:true, CCPA:true};
}
function effectiveRegs(site){
  const gdpr = site.manualRegs.GDPR || site.selectedCountries.some(c => (COUNTRIES.find(x=>x.code===c)||{}).regs && COUNTRIES.find(x=>x.code===c).regs.includes('GDPR'));
  const ccpa = site.manualRegs.CCPA || site.selectedCountries.some(c => (COUNTRIES.find(x=>x.code===c)||{}).regs && COUNTRIES.find(x=>x.code===c).regs.includes('CCPA'));
  return {GDPR: gdpr, CCPA: ccpa};
}

}
function chipClass(score){
  const g = gradeLabel(score);
  if(g==='A'||g==='B') return 'pass';
  if(g==='C') return 'partial';
  return 'fail';
}

function renderMain(site){

function renderCountryPanel(site){
  if(!state.countryPanelOpen) return '';
  const rows = COUNTRIES.map(c=>{
    const checked = site.selectedCountries.includes(c.code);
    return `<label class="country-row"><input type="checkbox" data-country-for="${c.code}" ${checked?'checked':''}> ${c.name}${c.note?` <span class="country-note">*</span>`:''}</label>`;
  }).join('');
  return `<div class="country-panel">${rows}<div class="country-footnote">* Switzerland is approximated to the GDPR baseline in this prototype \u2014 its own law (FADP) is distinct and has its own nuances.</div></div>`;
}

function renderDelta(site, prevScan){
  const g = blendedScore(site, site.scans[site.scans.length-1], 'GDPR');
  const c = blendedScore(site, site.scans[site.scans.length-1], 'CCPA');
  const cur = Math.round((g+c)/2);
  const prevG = blendedScore(site, prevScan, 'GDPR');
  const prevC = blendedScore(site, prevScan, 'CCPA');
  const prevBlend = Math.round((prevG+prevC)/2);
  const diff = cur - prevBlend;
  if(diff===0) return ' \u00B7 UNCHANGED SINCE LAST SCAN';
  if(diff>0) return ` \u00B7 <span class="delta-up">+${diff} PTS SINCE LAST SCAN</span>`;
  return ` \u00B7 <span class="delta-down">${diff} PTS SINCE LAST SCAN</span>`;
}

function renderComplianceTab(site, scan){
  const eff = effectiveRegs(site);
  const regs = [];
  if(eff.GDPR) regs.push('GDPR');
  if(eff.CCPA) regs.push('CCPA');

  if(regs.length===0) return `<p class="section-note">No regulation selected \u2014 toggle GDPR or CCPA/CPRA, or pick a country, above to see results.</p>`;

  const stampsHtml = regs.map(regKey=>{
    const {label} = regDefs(regKey);
    const score = blendedScore(site, scan, regKey);
    const grade = gradeLabel(score);
    return `
      <div class="stamp-wrap">
        <div class="stamp ${tierClass(grade)}"><div class="grade disp">${grade}</div><div class="glabel">${regKey}</div></div>
        <div>
          <div class="stamp-num mono">${score}/100</div>
          <div class="stamp-caption">${topGapsCaption(site, scan, regKey)}</div>
        </div>
      </div>
    `;
  }).join('');

  const blocksHtml = regs.map(regKey=>{
    const {scanned, checklist, label} = regDefs(regKey);
    const scannedRows = scanned.map(req=>{
      const raw = rawStatus(site, scan, regKey, req, 'scanned');
      const eff = itemEffectiveStatus(site, scan, regKey, req, 'scanned');
      const stClass = eff.toLowerCase();
      let note = '';
      if(eff==='Fail') note = `<div class="req-note fail">${req.hints.fail}</div>`;
      else if(eff==='Partial') note = `<div class="req-note partial">${req.hints.partial}</div>`;
      return `
        <div class="ledger-row">
          <div>
            <div class="req-text"><span class="source-tag">Scanned</span>${citeHover(req)} ${req.text}</div>
            <div class="layman-text">${req.layman}</div>

          <div class="status-badge ${stClass}">${eff}</div>

    }).join('');

    const checklistRows = checklist.map(item=>renderChecklistItem(site, scan, regKey, item)).join('');

    return `
      <div class="reg-block">
        <h3 class="disp">${regKey}</h3>
        <div class="reg-sub">${label}</div>
        <div class="ledger">${scannedRows}</div>

  }).join('');

  return `<div class="stamp-row">${stampsHtml}</div>${blocksHtml}`;
}

function renderOverrideControl(site, itemId, rawCurrentStatus){
  const key = site.id+'::'+itemId;

  let html = '';
  if(ov){
    html += `<div class="override-note"><span class="override-badge">Overridden</span>${ov.previousStatus} \u2192 ${ov.status} \u2014 \u201c${ov.explanation}\u201d

    html += `<div class="override-form">

  return html;
}

  let statusBadge = `<span class="status-badge ${eff.toLowerCase()}">${eff}</span>`;

  let bodyHtml = '';
  if(checked){
    if(st.needsFollowUp && !st.finalized){
      bodyHtml = `

            <button class="submit-btn" data-finalize-for="${item.id}">Submit answer for review</button>
          </div>
        </div>
      `;
    } else if(st.finalized){
      const staleDays = st.attestedAt ? Math.floor((Date.now()-st.attestedAt)/86400000) : 0;
      const isStale = staleDays > STALE_DAYS;
      bodyHtml = `
        <div class="checklist-body">
          <div class="result-box">
            <span class="confidence-tag">Confidence: ${st.confidence}</span>
            ${isStale ? `<span class="stale-badge">Needs re-attestation</span>` : ''}
          </div>
          <div class="rationale-text">${st.rationale}</div>
          <div class="attested-meta">Attested ${staleDays===0?'today':staleDays+' day'+(staleDays===1?'':'s')+' ago'}${isStale ? ' \u2014 stale, last-known status still counted toward score.' : '.'}</div>
        </div>
      `;
    } else {
      bodyHtml = `
        <div class="checklist-body">
          <textarea class="checklist-textarea" data-desc-for="${item.id}" placeholder="Briefly describe how this works today\u2026">${draft.description}</textarea>
          <div class="checklist-file-row">
            <label class="file-btn">\uD83D\uDCCE Attach screenshot (optional)
              <input type="file" accept="image/*" data-shot-for="${item.id}" style="display:none;">
            </label>
            ${draft.screenshot ? `<img class="thumb-preview" src="${draft.screenshot}">` : ''}
          </div>
          <button class="submit-btn" data-submit-for="${item.id}">Submit for review</button>
        </div>
      `;
    }
  }

  return `
    <div class="checklist-item">
      <div class="checklist-head-row">
        <div class="checklist-check-row">
          <input type="checkbox" id="chk-${item.id}" data-check-for="${item.id}" ${checked?'checked':''}>
          <div>
            <label class="checklist-label" for="chk-${item.id}"><span class="source-tag attested">Self-attested</span>${citeHover(item)} ${item.text}</label>
            <div class="layman-text" style="margin-left:27px;">${item.layman}</div>
            <div class="checklist-guidance">${item.guidance}</div>
          </div>
        </div>
        ${statusBadge}
      </div>
      ${bodyHtml}
      <div class="override-wrap" style="margin-left:27px;">${renderOverrideControl(site, item.id, raw)}</div>
    </div>
  `;
}

function renderRecommendationsTab(site, scan){
  const eff = effectiveRegs(site);
  let gaps = [];
  if(eff.GDPR) gaps = gaps.concat(gapItems(site, scan, 'GDPR'));
  if(eff.CCPA) gaps = gaps.concat(gapItems(site, scan, 'CCPA'));

  if(gaps.length===0){
    return `<p class="section-note">No open gaps across the selected regulations right now \u2014 nothing to recommend.</p>`;
  }

  const cardsHtml = gaps.map(g=>{
    const sevClass = g.item.sev==='high'?'high':g.item.sev==='med'?'med':'';
    return `
      <div class="rec-card ${sevClass}">
        <div class="rec-top">
          <div class="rec-title disp">[${g.regKey}] ${g.item.text}</div>
          <span class="status-badge ${g.status.toLowerCase()}">${g.status}</span>
        </div>
        <div class="rec-layman">${g.item.layman}</div>
        <ul class="rec-proposals">
          ${g.item.proposals.map(p=>`<li>${p}</li>`).join('')}
        </ul>
      </div>
    `;
  }).join('');

  return `
    <p class="rec-intro">Concrete directions for closing the gaps found above \u2014 written to be spec-ready for a product manager, not a legal opinion. Validate specifics with counsel before shipping.</p>
    ${cardsHtml}
  `;
}

function renderLegislationTab(){
  const regions = ['All', ...new Set(BILLS.map(b=>b.region))];
  const statuses = ['All', ...new Set(BILLS.map(b=>b.status))];
  const filtered = BILLS.filter(b=>{
    const rOk = state.legFilterRegion==='All' || b.region===state.legFilterRegion;
    const sOk = state.legFilterStatus==='All' || b.status===state.legFilterStatus;
    return rOk && sOk;
  });
  const cardsHtml = filtered.map(b=>`
    <div class="bill-card">
      <div class="bill-top">
        <div class="bill-name disp">${b.name}</div>
        <div class="bill-tags"><span class="tag">${b.region}</span><span class="tag">${b.status}</span></div>
      </div>
      <div class="bill-summary">${b.summary}</div>
      <div class="bill-meta">
        <div class="relevance"><b>Effective:</b> ${b.effective}</div>
        <div class="relevance"><b>Why it matters here:</b> ${b.relevance}</div>
        <div class="prep"><b>Suggested prep:</b> ${b.prep}</div>
      </div>
    </div>
  `).join('') || `<p class="section-note">No entries match this filter.</p>`;

  return `
    <p class="section-note">Sample dataset for this prototype \u2014 a live build would sync from a legal-tracking source on a weekly batch job. Last simulated refresh: Jul 21, 2026.</p>
    <div class="filters">
      <select id="leg-region-filter">${regions.map(r=>`<option value="${r}" ${r===state.legFilterRegion?'selected':''}>${r==='All'?'All regions':r}</option>`).join('')}</select>
      <select id="leg-status-filter">${statuses.map(s=>`<option value="${s}" ${s===state.legFilterStatus?'selected':''}>${s==='All'?'All statuses':s}</option>`).join('')}</select>
    </div>
    ${cardsHtml}
  `;
}

function renderRiskTab(site, scan){
  const eff = effectiveRegs(site);
  let combined = [];
  if(eff.GDPR) combined = combined.concat(gapItems(site, scan, 'GDPR'));
  if(eff.CCPA) combined = combined.concat(gapItems(site, scan, 'CCPA'));

  const top = combined.slice(0,5);

  if(top.length===0){
    return `<p class="section-note">No material risks surfaced across the selected regulations \u2014 nice work. Re-scan and re-attest periodically as the site changes.</p>`;
  }

  const itemsHtml = top.map((c,i)=>{
    const fine = FINES[c.item.id];
    const remedyText = c.source==='scanned'
      ? (c.status==='Fail' ? c.item.hints.fail : c.item.hints.partial)
      : (c.status==='Fail' ? 'Not yet implemented, or not yet attested with enough detail to confirm.' : 'Self-attested but not fully confirmed \u2014 see the Compliance Results tab for details.');
    const precedentHtml = fine ? `
      <div class="precedent">
        <div class="pre-label">Comparable enforcement pattern</div>
        <div>${fine.who} \u2014 ${fine.violation}.</div>
        <div style="margin-top:4px;">Fine: <span class="fine">${fine.fine}</span> \u00B7 ${fine.regulator} \u00B7 ${fine.year}</div>
      </div>
    ` : `<div class="precedent"><span class="none">No directly comparable sample case in this prototype\u2019s dataset.</span></div>`;

    return `
      <div class="risk-item">
        <div class="risk-rank disp">${i+1}</div>
        <div>
          <div class="risk-title">[${c.regKey} \u00B7 ${c.source==='scanned'?'Scanned':'Self-attested'}] ${c.item.text}</div>
          <div class="risk-sev">${SEV_LABEL[c.item.sev]} \u00B7 Currently: ${c.status}</div>
          <div class="risk-remedy">${remedyText}</div>
          ${precedentHtml}
        </div>
      </div>
    `;
  }).join('');

  return `${itemsHtml}<div class="risk-disclaimer">Enforcement examples above are composite / illustrative, built for this prototype \u2014 they are not verified real-world fines and should not be treated as predictive of any actual outcome.</div>`;
}

function renderTrustTab(scan){
  const grade = gradeLabel(scan.trust.score);
  const catsHtml = TRUST_CATS.map(c=>{
    const score = scan.trust.scores[c.id];
    const tier = score>=80?'good':score>=55?'moderate':'weak';
    const color = tier==='good'?'var(--verdigris)':tier==='moderate'?'var(--amber)':'var(--redline)';
    return `
      <div class="trust-cat">
        <div class="trust-cat-head"><div class="trust-cat-name">${c.name}</div><div class="trust-cat-score mono">${score}/100</div></div>
        <div class="bar-track"><div class="bar-fill" style="width:${score}%; background:${color};"></div></div>
        <div class="trust-cat-note">${c.notes[tier]}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="stamp-row">
      <div class="stamp-wrap">
        <div class="stamp ${tierClass(grade)}"><div class="grade disp">${grade}</div><div class="glabel">TRUST</div></div>
        <div>
          <div class="stamp-num mono">${scan.trust.score}/100</div>
          <div class="stamp-caption">Independent of legal compliance \u2014 measures how transparent the site\u2019s privacy practices feel to an end user.</div>
        </div>
      </div>
    </div>
    ${catsHtml}
  `;
}

/* ============================================================
   PRINT / EXPORT REPORT
   ============================================================ */
function buildPrintReportHTML(site, scan){
  const eff = effectiveRegs(site);
  const regs = []; if(eff.GDPR) regs.push('GDPR'); if(eff.CCPA) regs.push('CCPA');
  let html = `<h1>The Regulatory Ledger \u2014 Report</h1>
    <div class="pr-meta">${site.domain}${site.variant!=='Global'?' ('+site.variant+' version)':''} \u00B7 Generated ${new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>`;

  regs.forEach(regKey=>{
    const score = blendedScore(site, scan, regKey);
    html += `<h2>${regKey} \u2014 ${score}/100 (${gradeLabel(score)})</h2>`;
    const gaps = gapItems(site, scan, regKey);
    if(gaps.length===0){
      html += `<div class="pr-item">No material gaps found.</div>`;
    } else {
      gaps.forEach(g=>{
        html += `<div class="pr-item"><span class="pr-status">${g.status}</span> \u2014 ${g.item.text}<br><span class="pr-meta">${g.item.layman}</span><br><span class="pr-meta">Suggested fix: ${g.item.proposals[0]}</span></div>`;
      });
    }
  });

  html += `<h2>Risk highlights</h2>`;
  let combinedGaps = [];
  regs.forEach(regKey=>{ combinedGaps = combinedGaps.concat(gapItems(site, scan, regKey)); });
  combinedGaps.slice(0,3).forEach(c=>{
    const fine = FINES[c.item.id];
    html += `<div class="pr-item">${c.item.text} \u2014 ${SEV_LABEL[c.item.sev]}${fine ? `<br><span class="pr-meta">Comparable pattern: ${fine.who}, ${fine.fine} (${fine.regulator}, ${fine.year}) \u2014 illustrative only</span>` : ''}</div>`;
  });

  html += `<h2>Privacy Trust \u2014 ${scan.trust.score}/100 (${gradeLabel(scan.trust.score)})</h2>`;
  TRUST_CATS.forEach(c=>{
    html += `<div class="pr-item">${c.name}: ${scan.trust.scores[c.id]}/100</div>`;
  });

  html += `<p class="pr-meta" style="margin-top:24px;">This report provides informational guidance only, not legal advice. Enforcement figures are composite/illustrative. Generated by a prototype \u2014 self-attested items and their AI-style review are simulated.</p>`;
  return html;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(site){
  const addBtn = document.getElementById('btn-add-site');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    state.showNewScanForm = true;
    state.scanVariant = 'Global';
    render();
  });

  const cancelBtn = document.getElementById('btn-cancel-new');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.showNewScanForm = false; render(); });

  document.querySelectorAll('[data-variant]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.scanVariant = el.getAttribute('data-variant'); render(); });
  });

  const newForm = document.getElementById('new-scan-form');
  if(newForm) newForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('new-scan-input').value;
    if(val && val.trim()) startScan(cleanDomain(val), state.scanVariant);
  });

  document.querySelectorAll('[data-site-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedSiteId = el.getAttribute('data-site-id');
      state.activeTab = 'compliance';
      state.showNewScanForm = false;
      render();
    });
  });

  const rescanBtn = document.getElementById('btn-rescan');
  if(rescanBtn) rescanBtn.addEventListener('click', ()=>{ if(site) startScan(site.domain, site.variant, site); });

  const exportBtn = document.getElementById('btn-export');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    if(!site) return;
    const scan = site.scans[site.scans.length-1];
    document.getElementById('print-report').innerHTML = buildPrintReportHTML(site, scan);
    window.print();
  });

  const ffBtn = document.getElementById('btn-fastforward');
  if(ffBtn) ffBtn.addEventListener('click', ()=>{
    if(!site) return;
    Object.values(site.checklistState).forEach(st=>{
      if(st && st.attestedAt) st.attestedAt -= 100*86400000;
    });
    render();
  });

  document.querySelectorAll('.reg-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!site) return;
      site.manualRegs[el.getAttribute('data-reg')] = !site.manualRegs[el.getAttribute('data-reg')];
      render();
    });
  });

  const countryToggle = document.getElementById('btn-country-toggle');
  if(countryToggle) countryToggle.addEventListener('click', ()=>{ state.countryPanelOpen = !state.countryPanelOpen; render(); });

  document.querySelectorAll('[data-country-for]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      if(!site) return;
      const code = el.getAttribute('data-country-for');
      if(e.target.checked){
        if(!site.selectedCountries.includes(code)) site.selectedCountries.push(code);
      } else {
        site.selectedCountries = site.selectedCountries.filter(c=>c!==code);
      }
      render();
    });
  });

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.addEventListener('click', ()=>{ state.activeTab = el.getAttribute('data-tab'); render(); });
  });

  const regionFilter = document.getElementById('leg-region-filter');
  if(regionFilter) regionFilter.addEventListener('change', (e)=>{ state.legFilterRegion = e.target.value; render(); });
  const statusFilter = document.getElementById('leg-status-filter');
  if(statusFilter) statusFilter.addEventListener('change', (e)=>{ state.legFilterStatus = e.target.value; render(); });

  if(!site) return;

  document.querySelectorAll('[data-check-for]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const itemId = el.getAttribute('data-check-for');
      const checked = e.target.checked;
      site.checklistState[itemId] = checked ? {checked:true} : {checked:false};
      render();
    });
  });

  document.querySelectorAll('[data-desc-for]').forEach(el=>{
    el.addEventListener('input', (e)=>{ getDraft(site.id, el.getAttribute('data-desc-for')).description = e.target.value; });
  });
  document.querySelectorAll('[data-followup-for]').forEach(el=>{
    el.addEventListener('input', (e)=>{ getDraft(site.id, el.getAttribute('data-followup-for')).followUpAnswer = e.target.value; });
  });
  document.querySelectorAll('[data-shot-for]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const itemId = el.getAttribute('data-shot-for');
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ getDraft(site.id, itemId).screenshot = reader.result; render(); };
      reader.readAsDataURL(file);
    });
  });

  document.querySelectorAll('[data-submit-for]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const itemId = el.getAttribute('data-submit-for');
      const item = [...GDPR_CHECKLIST, ...CCPA_CHECKLIST].find(i=>i.id===itemId);
      const draft = getDraft(site.id, itemId);
      const result = reviewSubmission(item, draft.description, !!draft.screenshot, '');
      if(result.needsFollowUp){
        site.checklistState[itemId] = { checked:true, finalized:false, needsFollowUp:true, followUpQuestion: result.followUpQuestion, sketch: result.sketch };
      } else {
        site.checklistState[itemId] = { checked:true, finalized:true, needsFollowUp:false, status: result.status, confidence: result.confidence, rationale: result.rationale, attestedAt: Date.now() };
      }
      render();
    });
  });

  document.querySelectorAll('[data-finalize-for]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const itemId = el.getAttribute('data-finalize-for');
      const item = [...GDPR_CHECKLIST, ...CCPA_CHECKLIST].find(i=>i.id===itemId);
      const draft = getDraft(site.id, itemId);
      const result = reviewSubmission(item, draft.description, !!draft.screenshot, draft.followUpAnswer || 'no further detail provided');
      site.checklistState[itemId] = { checked:true, finalized:true, needsFollowUp:false, status: result.status, confidence: result.confidence, rationale: result.rationale, attestedAt: Date.now() };
      render();
    });
  });

  document.querySelectorAll('[data-override-open-for]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.overrideOpen[site.id+'::'+el.getAttribute('data-override-open-for')] = true;
      render();
    });
  });
  document.querySelectorAll('[data-override-cancel-for]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const itemId = el.getAttribute('data-override-cancel-for');
      delete state.overrideOpen[site.id+'::'+itemId];
      delete state.overrideDrafts[site.id+'::'+itemId];
      render();
    });
  });
  document.querySelectorAll('[data-override-status-for]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const itemId = el.getAttribute('data-override-status-for');
      const key = site.id+'::'+itemId;
      if(!state.overrideDrafts[key]) state.overrideDrafts[key] = {status:e.target.value, explanation:''};
      state.overrideDrafts[key].status = e.target.value;
    });
  });
  document.querySelectorAll('[data-override-explain-for]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const itemId = el.getAttribute('data-override-explain-for');
      const key = site.id+'::'+itemId;
      if(!state.overrideDrafts[key]) state.overrideDrafts[key] = {status:'Pass', explanation:''};
      state.overrideDrafts[key].explanation = e.target.value;
      state.overrideDrafts[key].error = false;
    });
  });
  document.querySelectorAll('[data-override-submit-for]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const itemId = el.getAttribute('data-override-submit-for');
      const key = site.id+'::'+itemId;
      const draft = state.overrideDrafts[key];
      if(!draft || !draft.explanation || draft.explanation.trim().length < 5){
        if(draft) draft.error = true;
        render();
        return;
      }
      // determine previous (pre-override) status
      const isGdprScanned = GDPR_SCANNED.find(r=>r.id===itemId);
      const isCcpaScanned = CCPA_SCANNED.find(r=>r.id===itemId);
      const isGdprChecklist = GDPR_CHECKLIST.find(r=>r.id===itemId);
      const scan = site.scans[site.scans.length-1];
      let regKey, source, reqObj;
      if(isGdprScanned){ regKey='GDPR'; source='scanned'; reqObj=isGdprScanned; }
      else if(isCcpaScanned){ regKey='CCPA'; source='scanned'; reqObj=isCcpaScanned; }
      else if(isGdprChecklist){ regKey='GDPR'; source='attested'; reqObj=isGdprChecklist; }
      else { regKey='CCPA'; source='attested'; reqObj=CCPA_CHECKLIST.find(r=>r.id===itemId); }
      const previousStatus = rawStatus(site, scan, regKey, reqObj, source);

      site.overrides[itemId] = { status: draft.status, explanation: draft.explanation.trim(), previousStatus, timestamp: Date.now() };
      if(!state.overrideHistory[itemId]) state.overrideHistory[itemId] = [];
      state.overrideHistory[itemId].push({domain: site.domain, explanation: draft.explanation.trim(), timestamp: Date.now()});
      delete state.overrideOpen[key];
      delete state.overrideDrafts[key];
      render();
    });
  });
  document.querySelectorAll('[data-clear-override]').forEach(el=>{
    el.addEventListener('click', ()=>{
      delete site.overrides[el.getAttribute('data-clear-override')];
      render();
    });
  });
}

function startScan(domain, variant, existingSite){
  state.scanning = true;
  state.scanTargetDomain = domain;
  state.scanVariant = variant || 'Global';
  state.scanStepIndex = 0;
  state.showNewScanForm = false;
  render();

  const stepInterval = setInterval(()=>{
    state.scanStepIndex++;
    if(state.scanStepIndex >= SCAN_STEPS.length){
      clearInterval(stepInterval);
      finishScan(domain, state.scanVariant, existingSite);
      return;
    }
    render();
  }, 480);
}

function finishScan(domain, variant, existingSite){
  const salt = String(Date.now());
  const scan = runScan(domain, variant, salt);

  if(existingSite){
    existingSite.scans.push(scan);
    state.selectedSiteId = existingSite.id;
  } else {
    const id = 'site-' + Date.now();
    const docketNum = state.nextDocketNum++;
    state.sites.push({
      id, domain, docketNum,
      variant: variant || 'Global',
      addedAt: Date.now(),
      manualRegs: defaultManualRegsFor(variant),
      selectedCountries: defaultCountriesFor(variant),
      scans: [scan],
      checklistState: {},
      overrides: {},
    });
    state.selectedSiteId = id;
  }
  state.scanning = false;
  state.activeTab = 'compliance';
  render();
}

render();
</script>
