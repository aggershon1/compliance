<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Regulatory Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A24;
    --ink-soft:#46524A;
    --ink-faint:#7A8479;
    --paper:#E3E6DE;
    --paper-raised:#EDEFE8;
    --paper-deep:#D7DBCF;
    --redline:#A63D2F;
    --redline-soft:#c96354;
    --verdigris:#4F7D6E;
    --verdigris-soft:#77a294;
    --amber:#B8863B;
    --amber-soft:#d1a765;
    --line: rgba(30,42,36,0.16);
    --line-strong: rgba(30,42,36,0.32);
    --shadow: 0 1px 0 rgba(30,42,36,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--verdigris-soft); color:var(--paper);}
  a{color:inherit;}

  .disp{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- shell ---------- */
  .shell{
    display:grid;
    grid-template-columns: 300px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .shell{grid-template-columns: 1fr;}
    .docket{border-right:none; border-bottom:1px solid var(--line-strong);}
  }

  /* ---------- masthead ---------- */
  .masthead{
    grid-column: 1 / -1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:22px 28px 16px 28px;
    border-bottom:2px solid var(--ink);
  }
  .masthead .wordmark{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.2px;
  }
  .masthead .wordmark small{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-weight:400;
    font-size:10.5px;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .masthead .dateline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
    text-align:right;
    line-height:1.6;
  }

  /* ---------- docket (sidebar) ---------- */
  .docket{
    border-right:1px solid var(--line-strong);
    padding:20px 0 0 0;
    display:flex;
    flex-direction:column;
  }
  .docket-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px 14px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .docket-head h2{
    font-size:11px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--ink-soft);
    margin:0;
  }
  .btn-new{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    background:var(--ink);
    color:var(--paper-raised);
    border:none;
    padding:6px 10px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .btn-new:hover{background:var(--verdigris);}

  .docket-list{ overflow-y:auto; flex:1; }
  .docket-entry{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  .docket-entry:hover{ background:var(--paper-raised); }
  .docket-entry.active{ background:var(--paper-raised); box-shadow: inset 3px 0 0 var(--ink); }
  .docket-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    letter-spacing:0.5px;
  }
  .docket-domain{
    font-weight:600;
    font-size:14px;
    margin:2px 0 6px 0;
    word-break:break-all;
  }
  .docket-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-mini{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:2px 6px;
    border-radius:2px;
    border:1px solid var(--line-strong);
    letter-spacing:0.3px;
  }
  .chip-mini.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .chip-mini.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .chip-mini.fail{ color:var(--redline); border-color:var(--redline-soft); }

  .docket-empty{
    padding:24px 20px;
    color:var(--ink-faint);
    font-size:12.5px;
  }

  .disclaimer-foot{
    padding:14px 20px;
    border-top:1px solid var(--line);
    font-size:10.5px;
    color:var(--ink-faint);
    line-height:1.5;
  }

  /* ---------- main ---------- */
  .main{ padding:28px 36px 60px 36px; max-width:960px; }
  .empty-state{
    margin-top:60px;
    max-width:520px;
  }
  .empty-state h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 10px 0;
  }
  .empty-state p{ color:var(--ink-soft); margin:0 0 22px 0; }

  .scan-form{ display:flex; gap:0; max-width:480px; }
  .scan-form input{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:11px 12px;
    border:1.5px solid var(--ink);
    border-right:none;
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:var(--radius) 0 0 var(--radius);
  }
  .scan-form input:focus{ outline:none; background:#fff; }
  .scan-form button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:0 18px;
    background:var(--ink);
    color:var(--paper-raised);
    border:1.5px solid var(--ink);
    border-radius:0 var(--radius) var(--radius) 0;
    cursor:pointer;
  }
  .scan-form button:hover{ background:var(--verdigris); border-color:var(--verdigris); }

  .scanning-box{
    max-width:480px;
    border:1.5px solid var(--ink);
    background:var(--paper-raised);
    padding:18px 20px;
    border-radius:var(--radius);
  }
  .scanning-box .cursor{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .scanning-step{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    padding:3px 0;
  }
  .scanning-step.done{ color:var(--verdigris); }
  .scanning-step.current{ color:var(--ink); }
  .scanning-step .mark{ display:inline-block; width:16px; }

  /* header of a site page */
  .site-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .site-header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px 0;
    word-break:break-all;
  }
  .site-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); }
  .site-meta .delta-up{ color:var(--verdigris); }
  .site-meta .delta-down{ color:var(--redline); }
  .rescan-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:8px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    white-space:nowrap;
  }
  .rescan-btn:hover{ background:var(--ink); color:var(--paper-raised); }

  /* regulation picker */
  .reg-picker{ display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  .reg-picker .label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-faint); }
  .reg-toggle{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border:1.5px solid var(--line-strong);
    border-radius:20px;
    cursor:pointer;
    background:none;
    color:var(--ink-soft);
  }
  .reg-toggle.on{ border-color:var(--ink); color:var(--ink); background:var(--paper-raised); font-weight:500; }

  /* tabs */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line-strong); margin-bottom:22px; }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.4px;
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
    bottom:-1px;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--redline); font-weight:500; }
  .tab-btn:hover:not(.active){ color:var(--ink-soft); }

  /* overall score row with stamps */
  .stamp-row{ display:flex; gap:26px; margin-bottom:28px; flex-wrap:wrap; }
  .stamp{
    width:88px; height:88px;
    border-radius:50%;
    border:3px double currentColor;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .stamp .grade{ font-family:'Fraunces', serif; font-weight:700; font-size:28px; line-height:1; }
  .stamp .glabel{ font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:1px; text-transform:uppercase; margin-top:3px; }
  .stamp.tier-a, .stamp.tier-b{ color:var(--verdigris); }
  .stamp.tier-c{ color:var(--amber); }
  .stamp.tier-d, .stamp.tier-f{ color:var(--redline); }
  .stamp-wrap{ display:flex; align-items:center; gap:12px; }
  .stamp-num{ font-family:'IBM Plex Mono', monospace; font-size:20px; color:var(--ink-faint); }
  .stamp-caption{ font-size:12px; color:var(--ink-soft); max-width:150px; }

  /* ledger table of requirements */
  .reg-block{ margin-bottom:34px; }
  .reg-block h3{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:600;
    margin:0 0 2px 0;
  }
  .reg-block .reg-sub{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-bottom:12px; }
  .ledger{ border-top:1px solid var(--line-strong); }
  .ledger-row{
    display:grid;
    grid-template-columns: 1fr 90px;
    gap:16px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    align-items:start;
  }
  .req-text{ font-size:13.5px; }
  .req-code{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-faint); margin-right:8px; }
  .req-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:5px;
    padding-left:14px;
    border-left:2px solid var(--line-strong);
  }
  .req-note.fail{ border-left-color:var(--redline); color:var(--redline-soft); }
  .req-note.partial{ border-left-color:var(--amber); color:#8c6a2e; }
  .status-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    text-align:center;
    justify-self:end;
    white-space:nowrap;
    border:1.3px solid;
  }
  .status-badge.pass{ color:var(--verdigris); border-color:var(--verdigris-soft); }
  .status-badge.partial{ color:var(--amber); border-color:var(--amber-soft); }
  .status-badge.fail{ color:var(--redline); border-color:var(--redline-soft); }
  .status-badge.na{ color:var(--ink-faint); border-color:var(--line-strong); }

  /* legislation cards */
  .filters{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filters select{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:6px 10px;
    border:1.3px solid var(--line-strong);
    border-radius:var(--radius);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .bill-card{
    border:1px solid var(--line-strong);
    border-left:3px solid var(--ink);
    background:var(--paper-raised);
    padding:14px 16px;
    margin-bottom:12px;
    border-radius:0 var(--radius) var(--radius) 0;
  }
  .bill-top{ display:flex; justify-content:space-between; gap:12px; margin-bottom:4px; align-items:baseline; flex-wrap:wrap; }
  .bill-name{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; }
  .bill-tags{ display:flex; gap:6px; flex-shrink:0; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.4px; padding:2px 7px; border-radius:2px; border:1px solid var(--line-strong); color:var(--ink-soft); }
  .bill-summary{ font-size:12.8px; color:var(--ink-soft); margin:6px 0; }
  .bill-meta{ font-size:12px; margin-top:8px; }
  .bill-meta .relevance{ margin-bottom:4px; }
  .bill-meta .prep{ color:var(--verdigris); }
  .bill-meta b{ font-weight:600; }

  /* risk tab */
  .risk-item{
    display:grid;
    grid-template-columns: 34px 1fr;
    gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .risk-rank{ font-family:'Fraunces', serif; font-size:24px; font-weight:700; color:var(--redline); }
  .risk-title{ font-size:14.5px; font-weight:500; margin-bottom:4px; }
  .risk-sev{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .risk-remedy{ font-size:12.8px; color:var(--ink-soft); margin-bottom:10px; }
  .precedent{
    background:var(--paper-raised);
    border:1px dashed var(--line-strong);
    padding:10px 12px;
    font-size:12px;
    border-radius:var(--radius);
  }
  .precedent .pre-label{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); margin-bottom:4px; }
  .precedent .fine{ color:var(--redline); font-weight:600; font-family:'IBM Plex Mono', monospace; }
  .precedent .none{ color:var(--ink-faint); font-style:italic; }

  .risk-disclaimer{
    margin-top:20px;
    font-size:11.5px;
    color:var(--ink-faint);
    border-top:1px solid var(--line);
    padding-top:12px;
  }

  /* trust tab */
  .trust-cat{ margin-bottom:20px; }
  .trust-cat-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .trust-cat-name{ font-weight:600; font-size:14px; }
  .trust-cat-score{ font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .bar-track{ height:6px; background:var(--paper-deep); border-radius:4px; overflow:hidden; margin-bottom:8px; }
  .bar-fill{ height:100%; border-radius:4px; }
  .trust-cat-note{ font-size:12.8px; color:var(--ink-soft); }

  .section-note{ font-size:11.5px; color:var(--ink-faint); margin-bottom:16px; font-family:'IBM Plex Mono', monospace; }

  .foot-space{ height:40px; }
</style>
</head>
<body>
<div id="app"></div>

<script>

   DATA — regulation requirements, remediation hints, mock
   legislation & enforcement datasets. All enforcement figures
   are composite / illustrative for prototype purposes only.
   ============================================================ */

           fail:'A financial incentive program was detected without the required disclosure.'}},

  'ccpa-7': {who:'Consumer app (composite case)', violation:'Undisclosed sharing of sensitive personal information', fine:'$3.7M', regulator:'California Attorney General', year:2024},

const BILLS = [
  {name:'EU AI Act — high-risk system obligations', region:'EU', status:'Enforcement phasing in', effective:'Phased 2025\u20132027',

   relevance:'Would eventually replace or layer on top of state laws currently used for compliance.',
   prep:'Track committee status; avoid building compliance solely around the current state patchwork.'},
  {name:'Colorado Privacy Act — profiling amendments', region:'US-Colorado', status:'In effect', effective:'2024\u20132026 phased',
   summary:'Adds specific obligations around profiling used for consequential decisions (housing, employment, credit, etc).',
   relevance:'Applies if the site profiles Colorado residents for decisions with legal or similarly significant effects.',
   prep:'Add an opt-out specifically for profiling used in consequential decisions.'},
  {name:'California Delete Act (SB 362)', region:'US-California', status:'Passed, phasing in', effective:'2026',
   summary:'Creates a one-click deletion mechanism across registered data brokers via the DROP portal.',
   relevance:'Relevant if the site sells or shares data with registered data brokers.',
   prep:'Confirm data-broker registration status if the site shares data with brokers.'},
  {name:'California AI Transparency Act (SB 942)', region:'US-California', status:'In effect', effective:'2026',
   summary:'Requires provenance disclosures and detection tools for generative AI content offered to California users.',
   relevance:'Relevant if the site offers generative AI features to California users.',
   prep:'Add AI content provenance disclosures if generative features are in use.'},
  {name:'LGPD enforcement ramp-up', region:'Brazil', status:'In effect', effective:'Ongoing',
   summary:'Brazil\u2019s national data protection authority (ANPD) continuing to increase enforcement activity and guidance.',
   relevance:'Relevant if the site serves Brazilian users or processes their data.',
   prep:'Confirm a data controller is designated for Brazilian operations.'},
  {name:'Consumer Privacy Protection Act (Bill C-27)', region:'Canada', status:'Proposed / reintroduction expected', effective:'TBD',
   summary:'Would modernize PIPEDA with GDPR-like rights including stronger consent and portability provisions.',
   relevance:'Would raise the bar above current PIPEDA obligations if the site serves Canadian users.',
   prep:'Monitor status; current PIPEDA obligations still apply in the meantime.'},
  {name:'UK Data (Use and Access) reforms', region:'UK', status:'Passed, phasing in', effective:'2025\u20132026',
   summary:'Adjusts UK GDPR in areas like cookie-consent exemptions and legitimate-interest processing.',
   relevance:'Relevant if the site processes UK residents\u2019 data under UK GDPR, which is diverging gradually from EU GDPR.',
   prep:'Watch for updated cookie-consent exemption rules that may simplify some banners.'},
];

const TRUST_CATS = [
  {id:'minimization', name:'Data minimization',
   notes:{good:'Collection appears scoped to stated purposes — keep auditing fields as forms change.',
           moderate:'Some optional fields are collected without a clearly stated purpose. Tag each field with a retention/purpose reason.',
           weak:'Forms request more data than the stated purpose requires. Cut optional fields and require justification for any new one added.'}},
  {id:'consent', name:'Consent clarity',
   notes:{good:'Consent language is specific and avoids bundling unrelated permissions together.',
           moderate:'Consent copy is understandable but bundles marketing and functional cookies together — separate them.',
           weak:'Consent language is dense legal text with no plain-language summary above it.'}},
  {id:'rights', name:'User rights support',
   notes:{good:'Access, delete, and export flows are self-service and confirm completion to the user.',
           moderate:'Rights exist but require emailing support, which adds friction and delay.',
           weak:'No visible self-service path exists for users to exercise their data rights.'}},
  {id:'thirdparty', name:'Third-party transparency',
   notes:{good:'Sub-processors and ad/analytics partners are named with an up-to-date list.',
           moderate:'Third parties are referenced generically ("partners") without a named list.',
           weak:'There is no disclosure of which third parties receive user data.'}},
  {id:'retention', name:'Retention specificity',
   notes:{good:'Retention periods are stated per data category, not just "as long as necessary."',
           moderate:'A general retention statement exists but isn\u2019t broken out by data type.',
           weak:'No retention period is stated anywhere in the policy.'}},
];

const SEV_WEIGHT = {high:3, med:2, low:1};
const SEV_LABEL = {high:'High severity', med:'Medium severity', low:'Low severity'};

/* ============================================================
   DETERMINISTIC PSEUDO-RANDOM (seeded by domain + item + salt)
   ============================================================ */
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5) - h + str.charCodeAt(i); h |= 0; }
  return h;
}
function seededRandom(seedStr){
  let h = hashStr(seedStr);
  let x = Math.sin(h) * 10000;
  return x - Math.floor(x);
}

function statusFor(domain, salt, reqId, canBeNA){
  const seedBase = domain + '::' + salt + '::' + reqId;
  if(canBeNA && seededRandom(seedBase + '::na') < 0.12) return 'NA';
  const r = seededRandom(seedBase + '::status');
  if(r < 0.42) return 'Pass';
  if(r < 0.74) return 'Partial';
  return 'Fail';
}

function scoreFor(reqs, results){
  let total = 0, earned = 0;
  reqs.forEach(r=>{
    const st = results[r.id];
    if(st === 'NA') return;
    const w = SEV_WEIGHT[r.sev];
    total += w;
    if(st === 'Pass') earned += w;
    else if(st === 'Partial') earned += w * 0.5;
  });
  if(total === 0) return 100;
  return Math.round((earned/total)*100);
}

function gradeLabel(score){
  if(score >= 90) return 'A';
  if(score >= 80) return 'B';
  if(score >= 70) return 'C';
  if(score >= 60) return 'D';
  return 'F';
}
function tierClass(grade){
  if(grade==='A') return 'tier-a';
  if(grade==='B') return 'tier-b';
  if(grade==='C') return 'tier-c';
  if(grade==='D') return 'tier-d';
  return 'tier-f';
}

function runScan(domain, salt){
  const gdprResults = {}; GDPR_REQS.forEach(r=>{ gdprResults[r.id] = statusFor(domain, salt, r.id, r.na); });
  const ccpaResults = {}; CCPA_REQS.forEach(r=>{ ccpaResults[r.id] = statusFor(domain, salt, r.id, r.na); });
  const gdprScore = scoreFor(GDPR_REQS, gdprResults);
  const ccpaScore = scoreFor(CCPA_REQS, ccpaResults);

  const trust = {};
  TRUST_CATS.forEach(c=>{
    const r = seededRandom(domain + '::' + salt + '::trust::' + c.id);
    trust[c.id] = Math.round(40 + r*58); // 40-98
  });
  const trustScore = Math.round(TRUST_CATS.reduce((a,c)=>a+trust[c.id],0)/TRUST_CATS.length);

  return {
    timestamp: Date.now(),
    gdpr: {results: gdprResults, score: gdprScore},
    ccpa: {results: ccpaResults, score: ccpaScore},
    trust: {scores: trust, score: trustScore},
  };
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
  sites: [],           // {id, domain, addedAt, selectedRegs:{GDPR:bool,CCPA:bool}, scans:[...]}
  selectedSiteId: null,
  activeTab: 'compliance',
  scanning: false,
  scanStepIndex: 0,
  scanTargetDomain: '',
  legFilterRegion: 'All',
  legFilterStatus: 'All',
  nextDocketNum: 1,
};

const SCAN_STEPS = [
  'Crawling site structure\u2026',
  'Reading privacy policy & terms\u2026',
  'Inventorying cookies & trackers\u2026',
  'Comparing against selected regulations\u2026',
  'Compiling risk & trust assessment\u2026',
];

function cleanDomain(input){
  let d = input.trim().toLowerCase();
  d = d.replace(/^https?:\/\//, '').replace(/^www\./, '');
  d = d.split('/')[0];
  return d || 'example.com';
}

function pad3(n){ return String(n).padStart(3,'0'); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const site = state.sites.find(s=>s.id===state.selectedSiteId);

  app.innerHTML = `
    <div class="shell">
      <div class="masthead">
        <div class="wordmark disp">The Regulatory Ledger<small>Compliance &amp; privacy audit workbench \u2014 prototype</small></div>
        <div class="dateline mono">DOCKET OPEN<br>${new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}</div>
      </div>
      <div class="docket">
        <div class="docket-head">
          <h2>Docket</h2>
          <button class="btn-new" id="btn-add-site">+ New scan</button>
        </div>
        <div class="docket-list">
          ${renderDocketList()}
        </div>
        <div class="disclaimer-foot">
          This tool provides informational guidance only, not legal advice. Consult qualified counsel before making formal compliance decisions. Enforcement figures shown are composite / illustrative, not verified real-world records.
        </div>
      </div>
      <div class="main">
        ${renderMain(site)}
      </div>
    </div>
  `;

  attachHandlers(site);
}

function renderDocketList(){
  if(state.sites.length === 0 && !state.scanning){
    return `<div class="docket-empty">No sites scanned yet. Add a site to begin the first audit.</div>`;
  }
  let html = '';
  if(state.scanning){
    html += `<div class="docket-entry active"><div class="docket-num mono">NO. ${pad3(state.nextDocketNum)}</div>
      <div class="docket-domain">${state.scanTargetDomain}</div>
      <div class="docket-chips"><span class="chip-mini">scanning\u2026</span></div></div>`;
  }
  [...state.sites].reverse().forEach(s=>{
    const scan = s.scans[s.scans.length-1];
    html += `<button class="docket-entry ${s.id===state.selectedSiteId?'active':''}" data-site-id="${s.id}">
      <div class="docket-num mono">NO. ${pad3(s.docketNum)}</div>
      <div class="docket-domain">${s.domain}</div>
      <div class="docket-chips">
        <span class="chip-mini ${chipClassForScore(scan.gdpr.score)}">GDPR ${gradeLabel(scan.gdpr.score)}</span>
        <span class="chip-mini ${chipClassForScore(scan.ccpa.score)}">CCPA ${gradeLabel(scan.ccpa.score)}</span>
      </div>
    </button>`;
  });
  return html;
}

function chipClassForScore(score){
  const g = gradeLabel(score);
  if(g==='A'||g==='B') return 'pass';
  if(g==='C') return 'partial';
  return 'fail';
}

function renderMain(site){
  if(state.scanning){
    return renderScanningView();
  }
  if(!site){
    return `
      <div class="empty-state">
        <h1 class="disp">Open a new case file.</h1>
        <p>Enter a website to run a full-site crawl against GDPR and CCPA/CPRA, surface upcoming legislation that could affect it, and score its general privacy trustworthiness.</p>
        <form class="scan-form" id="empty-scan-form">
          <input type="text" id="empty-scan-input" placeholder="e.g. acmehealth.com" autocomplete="off">
          <button type="submit">Scan site</button>
        </form>
      </div>
    `;
  }

  const scan = site.scans[site.scans.length-1];
  const prevScan = site.scans.length > 1 ? site.scans[site.scans.length-2] : null;

  let body = '';
  if(state.activeTab === 'compliance') body = renderComplianceTab(site, scan);
  else if(state.activeTab === 'legislation') body = renderLegislationTab();
  else if(state.activeTab === 'risk') body = renderRiskTab(site, scan);
  else if(state.activeTab === 'trust') body = renderTrustTab(scan);

  return `
    <div class="site-header">
      <div>
        <h1 class="disp">${site.domain}</h1>
        <div class="site-meta">
          NO. ${pad3(site.docketNum)} \u00B7 LAST SCANNED ${new Date(scan.timestamp).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
          ${prevScan ? renderDelta(scan, prevScan) : ''}
        </div>
      </div>
      <button class="rescan-btn" id="btn-rescan">Re-scan now</button>
    </div>

    <div class="reg-picker">
      <span class="label">Regulations in scope</span>
      <button class="reg-toggle ${site.selectedRegs.GDPR?'on':''}" data-reg="GDPR">GDPR</button>
      <button class="reg-toggle ${site.selectedRegs.CCPA?'on':''}" data-reg="CCPA">CCPA / CPRA</button>
    </div>

    <div class="tabs">
      <button class="tab-btn ${state.activeTab==='compliance'?'active':''}" data-tab="compliance">COMPLIANCE RESULTS</button>
      <button class="tab-btn ${state.activeTab==='legislation'?'active':''}" data-tab="legislation">UPCOMING LEGISLATION</button>
      <button class="tab-btn ${state.activeTab==='risk'?'active':''}" data-tab="risk">RISK &amp; PRECEDENT</button>
      <button class="tab-btn ${state.activeTab==='trust'?'active':''}" data-tab="trust">PRIVACY TRUST</button>
    </div>

    ${body}
    <div class="foot-space"></div>
  `;
}

function renderDelta(scan, prevScan){
  const cur = Math.round((scan.gdpr.score + scan.ccpa.score)/2);
  const prev = Math.round((prevScan.gdpr.score + prevScan.ccpa.score)/2);
  const diff = cur - prev;
  if(diff === 0) return ' \u00B7 UNCHANGED SINCE LAST SCAN';
  if(diff > 0) return ` \u00B7 <span class="delta-up">+${diff} PTS SINCE LAST SCAN</span>`;
  return ` \u00B7 <span class="delta-down">${diff} PTS SINCE LAST SCAN</span>`;
}

function renderScanningView(){
  const stepsHtml = SCAN_STEPS.map((s,i)=>{
    let cls = 'scanning-step';
    let mark = '\u00B7';
    if(i < state.scanStepIndex){ cls += ' done'; mark = '\u2713'; }
    else if(i === state.scanStepIndex){ cls += ' current'; mark = '\u2192'; }
    return `<div class="${cls}"><span class="mark">${mark}</span>${s}</div>`;
  }).join('');
  return `
    <div class="empty-state">
      <h1 class="disp">Scanning ${state.scanTargetDomain}</h1>
      <div class="scanning-box">
        <div class="cursor mono" style="margin-bottom:10px;">Running full-site crawl \u2014 this is simulated for the prototype.</div>
        ${stepsHtml}
      </div>
    </div>
  `;
}

function renderComplianceTab(site, scan){
  const regs = [];
  if(site.selectedRegs.GDPR) regs.push({key:'GDPR', reqs:GDPR_REQS, data:scan.gdpr, label:'General Data Protection Regulation \u2014 EU / EEA'});
  if(site.selectedRegs.CCPA) regs.push({key:'CCPA', reqs:CCPA_REQS, data:scan.ccpa, label:'California Consumer Privacy Act, as amended by CPRA'});

  if(regs.length === 0){
    return `<p class="section-note">No regulation selected \u2014 toggle GDPR or CCPA/CPRA above to see results.</p>`;
  }

  const stampsHtml = regs.map(r=>{
    const grade = gradeLabel(r.data.score);
    return `
      <div class="stamp-wrap">
        <div class="stamp ${tierClass(grade)}">
          <div class="grade disp">${grade}</div>
          <div class="glabel">${r.key}</div>
        </div>
        <div>
          <div class="stamp-num mono">${r.data.score}/100</div>
          <div class="stamp-caption">Overall ${r.key} compliance score, weighted by requirement severity.</div>
        </div>
      </div>
    `;
  }).join('');

  const blocksHtml = regs.map(r=>{
    const rows = r.reqs.map(req=>{
      const st = r.data.results[req.id];
      const stClass = st.toLowerCase();
      let note = '';
      if(st === 'Fail') note = `<div class="req-note fail">${req.hints.fail}</div>`;
      else if(st === 'Partial') note = `<div class="req-note partial">${req.hints.partial}</div>`;
      return `
        <div class="ledger-row">
          <div>
            <div class="req-text"><span class="req-code">${req.code}</span>${req.text}</div>
            ${note}
          </div>
          <div class="status-badge ${stClass}">${st}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="reg-block">
        <h3 class="disp">${r.key}</h3>
        <div class="reg-sub">${r.label}</div>
        <div class="ledger">${rows}</div>
      </div>
    `;
  }).join('');

  return `<div class="stamp-row">${stampsHtml}</div>${blocksHtml}`;
}

function renderLegislationTab(){
  const regions = ['All', ...new Set(BILLS.map(b=>b.region))];
  const statuses = ['All', ...new Set(BILLS.map(b=>b.status))];

  const filtered = BILLS.filter(b=>{
    const rOk = state.legFilterRegion === 'All' || b.region === state.legFilterRegion;
    const sOk = state.legFilterStatus === 'All' || b.status === state.legFilterStatus;
    return rOk && sOk;
  });

  const cardsHtml = filtered.map(b=>`
    <div class="bill-card">
      <div class="bill-top">
        <div class="bill-name disp">${b.name}</div>
        <div class="bill-tags">
          <span class="tag">${b.region}</span>
          <span class="tag">${b.status}</span>
        </div>
      </div>
      <div class="bill-summary">${b.summary}</div>
      <div class="bill-meta">
        <div class="relevance"><b>Effective:</b> ${b.effective}</div>
        <div class="relevance"><b>Why it matters here:</b> ${b.relevance}</div>
        <div class="prep"><b>Suggested prep:</b> ${b.prep}</div>
      </div>
    </div>
  `).join('') || `<p class="section-note">No entries match this filter.</p>`;

  return `
    <p class="section-note">Sample dataset for this prototype \u2014 a live build would sync from a legal-tracking source on a weekly batch job. Last simulated refresh: Jul 21, 2026.</p>
    <div class="filters">
      <select id="leg-region-filter">${regions.map(r=>`<option value="${r}" ${r===state.legFilterRegion?'selected':''}>${r==='All'?'All regions':r}</option>`).join('')}</select>
      <select id="leg-status-filter">${statuses.map(s=>`<option value="${s}" ${s===state.legFilterStatus?'selected':''}>${s==='All'?'All statuses':s}</option>`).join('')}</select>
    </div>
    ${cardsHtml}
  `;
}

function renderRiskTab(site, scan){
  const combined = [];
  if(site.selectedRegs.GDPR) GDPR_REQS.forEach(r=>combined.push({reg:'GDPR', req:r, status:scan.gdpr.results[r.id]}));
  if(site.selectedRegs.CCPA) CCPA_REQS.forEach(r=>combined.push({reg:'CCPA', req:r, status:scan.ccpa.results[r.id]}));

  const risky = combined.filter(c=>c.status==='Fail' || c.status==='Partial');
  risky.sort((a,b)=>{
    const statusWeight = s => s==='Fail' ? 2 : 1;
    const sa = SEV_WEIGHT[a.req.sev]*10 + statusWeight(a.status);
    const sb = SEV_WEIGHT[b.req.sev]*10 + statusWeight(b.status);
    return sb - sa;
  });
  const top = risky.slice(0,5);

  if(top.length === 0){
    return `<p class="section-note">No material risks surfaced by this scan across the selected regulations \u2014 nice work. Re-scan periodically as the site changes.</p>`;
  }

  const itemsHtml = top.map((c,i)=>{
    const fine = FINES[c.req.id];
    const remedyText = c.status==='Fail' ? c.req.hints.fail : c.req.hints.partial;
    const precedentHtml = fine ? `
      <div class="precedent">
        <div class="pre-label">Comparable enforcement pattern</div>
        <div>${fine.who} \u2014 ${fine.violation}.</div>
        <div style="margin-top:4px;">Fine: <span class="fine">${fine.fine}</span> \u00B7 ${fine.regulator} \u00B7 ${fine.year}</div>
      </div>
    ` : `<div class="precedent"><span class="none">No directly comparable sample case in this prototype\u2019s dataset.</span></div>`;

    return `
      <div class="risk-item">
        <div class="risk-rank disp">${i+1}</div>
        <div>
          <div class="risk-title">[${c.reg}] ${c.req.text}</div>
          <div class="risk-sev">${SEV_LABEL[c.req.sev]} \u00B7 Currently: ${c.status}</div>
          <div class="risk-remedy">${remedyText}</div>
          ${precedentHtml}
        </div>
      </div>
    `;
  }).join('');

  return `
    ${itemsHtml}
    <div class="risk-disclaimer">Enforcement examples above are composite / illustrative, built for this prototype \u2014 they are not verified real-world fines and should not be treated as predictive of any actual outcome.</div>
  `;
}

function renderTrustTab(scan){
  const grade = gradeLabel(scan.trust.score);
  const catsHtml = TRUST_CATS.map(c=>{
    const score = scan.trust.scores[c.id];
    const tier = score >= 80 ? 'good' : score >= 55 ? 'moderate' : 'weak';
    const color = tier==='good' ? 'var(--verdigris)' : tier==='moderate' ? 'var(--amber)' : 'var(--redline)';
    return `
      <div class="trust-cat">
        <div class="trust-cat-head">
          <div class="trust-cat-name">${c.name}</div>
          <div class="trust-cat-score mono">${score}/100</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${score}%; background:${color};"></div></div>
        <div class="trust-cat-note">${c.notes[tier]}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="stamp-row">
      <div class="stamp-wrap">
        <div class="stamp ${tierClass(grade)}">
          <div class="grade disp">${grade}</div>
          <div class="glabel">TRUST</div>
        </div>
        <div>
          <div class="stamp-num mono">${scan.trust.score}/100</div>
          <div class="stamp-caption">Independent of legal compliance \u2014 measures how transparent and trustworthy the site\u2019s privacy practices feel to an end user.</div>
        </div>
      </div>
    </div>
    ${catsHtml}
  `;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(site){
  const addBtn = document.getElementById('btn-add-site');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const domain = prompt('Enter a website to scan (e.g. acmehealth.com):');
    if(domain && domain.trim()) startScan(cleanDomain(domain));
  });

  const emptyForm = document.getElementById('empty-scan-form');
  if(emptyForm) emptyForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('empty-scan-input').value;
    if(val && val.trim()) startScan(cleanDomain(val));
  });

  document.querySelectorAll('[data-site-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedSiteId = el.getAttribute('data-site-id');
      state.activeTab = 'compliance';
      render();
    });
  });

  const rescanBtn = document.getElementById('btn-rescan');
  if(rescanBtn) rescanBtn.addEventListener('click', ()=>{
    if(site) startScan(site.domain, site);
  });

  document.querySelectorAll('.reg-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!site) return;
      const reg = el.getAttribute('data-reg');
      site.selectedRegs[reg] = !site.selectedRegs[reg];
      render();
    });
  });

  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeTab = el.getAttribute('data-tab');
      render();
    });
  });

  const regionFilter = document.getElementById('leg-region-filter');
  if(regionFilter) regionFilter.addEventListener('change', (e)=>{
    state.legFilterRegion = e.target.value;
    render();
  });
  const statusFilter = document.getElementById('leg-status-filter');
  if(statusFilter) statusFilter.addEventListener('change', (e)=>{
    state.legFilterStatus = e.target.value;
    render();
  });
}

function startScan(domain, existingSite){
  state.scanning = true;
  state.scanTargetDomain = domain;
  state.scanStepIndex = 0;
  render();

  const stepInterval = setInterval(()=>{
    state.scanStepIndex++;
    if(state.scanStepIndex >= SCAN_STEPS.length){
      clearInterval(stepInterval);
      finishScan(domain, existingSite);
      return;
    }
    render();
  }, 480);
}

function finishScan(domain, existingSite){
  const salt = String(Date.now());
  const scan = runScan(domain, salt);

  if(existingSite){
    existingSite.scans.push(scan);
    state.selectedSiteId = existingSite.id;
  } else {
    const id = 'site-' + Date.now();
    const docketNum = state.nextDocketNum++;
    state.sites.push({
      id, domain, docketNum,
      addedAt: Date.now(),
      selectedRegs: {GDPR:true, CCPA:true},
      scans: [scan],
    });
    state.selectedSiteId = id;
  }

  state.scanning = false;
  state.activeTab = 'compliance';
  render();
}

render();
</script>
